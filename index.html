  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:12px; color:var(--mut); margin-top:3px; line-height:1.5;\">For reports from before you set up Stockline: records revenue, actual fees &amp; postage into their original months, but does <b>not<\u002Fb> deduct stock or touch FIFO batches (your current stock count already reflects those old sales). Turn OFF for new reports going forward.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:34px; height:19px; border-radius:12px; background:{{ backfillTrackBg }}; position:relative; flex-shrink:0;\">\n            <div style=\"position:absolute; top:2.5px; left:{{ backfillKnobLeft }}; width:14px; height:14px; border-radius:50%; background:white; transition:left .18s ease;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showModeGuard }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed; inset:0; background:var(--ovl); display:flex; align-items:center; justify-content:center; z-index:1100;\">\n            <div style=\"width:540px; max-width:92vw; background:var(--card); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:12px;\">\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px;\">{{ modeGuardTitle }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--ink2); line-height:1.6;\">{{ modeGuardMsg }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; font-weight:700; color:var(--mut); background:var(--bg); border-radius:8px; padding:8px 12px;\">Transactions in file: {{ modeGuardRange }}<\u002Fdiv>\n              <div style=\"display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; border-top:1px solid var(--dv); padding-top:14px;\">\n                <div sc-camel-on-click=\"{{ modeGuardCancel }}\" style=\"padding:9px 14px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; font-weight:700; cursor:pointer;\">Cancel<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ modeGuardProce rorMsg }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1px; background:var(--dv); border:1px solid var(--dv); border-radius:10px; overflow:hidden;\">\n                  <sc-for list=\"{{ preflightRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                    <div style=\"background:var(--card); padding:12px 14px;\">\n                      <div style=\"font-size:11.5px; color:var(--mut); font-weight:600;\">{{ r.label }}<\u002Fdiv>\n                      <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:17px; color:{{ r.tone }}; margin-top:3px;\">{{ r.value }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ preflightClean }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:13px 16px; border-radius:10px; background:var(--grn-soft); font-size:13px; font-weight:600; color:var(--grn); line-height:1.6;\">No missing costs, unknown SKUs or filed-period conflicts found.<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ preflightHasIssues }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex; flex-direction:column; gap:12px;\">\n                    <sc-for list=\"{{ preflightIssues }}\" as=\"it\" hint-placeholder-count=\"2\">\n                      <div style=\"border:1px solid var(--bd); border-left:3px solid {{ it.tone }}; border-radius:10px; padding:13px 15px; display:flex; flex-direction:column; gap:6px;\">\n                        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px;\">\n                          <div style=\"font-size:13.5px; font-weight:700; color:{{ it.tone }};\">{{ it.title }}<\u002Fdiv>\n                          <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:15px; color:{{ it.tone }};\">{{ it.countLabel }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"font-size:12.5px; color:var(--mut); line-height:1.6;\">{{ it.detail }}<\u002Fdiv>\n                        <sc-if value=\"{{ it.hasSamples }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;\">\n                            <sc-for list=\"{{ it.samples }}\" as=\"s\" hint-placeholder-count=\"3\">\n                              <div style=\"font-size:11.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); border-radius:6px; padding:4px 8px; color:var(--ink2);\">{{ s.text }}<\u002Fdiv>\n                            <\u002Fsc-for>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"padding:16px 24px; border-top:1px solid var(--dv); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;\">\n                <div sc-camel-on-click=\"{{ preflightCancel }}\" style=\"padding:10px 18px; border-radius:9px; border:1px solid var(--bd2); font-size:13px; font-weight:700; cursor:pointer;\">Cancel<\u002Fdiv>\n                <sc-if value=\"{{ preflightCanImport }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div sc-camel-on-click=\"{{ preflightConfirm }}\" style=\"padding:10px 20px; border-radius:9px; background:var(--acc); color:white; font-size:13px; font-weight:700; cursor:pointer;\">{{ preflightConfirmLabel }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid; grid-template-columns:{{ responsiveCols2 }}; gap:20px; margin-bottom:20px;\">\n          <div style=\"background:var(--card); border:1px dashed var(--bd3); border-radius:14px; padding:22px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;\">\n            <div style=\"font-weight:700; font-size:14px;\">Transaction Report (CSV)<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--mut);\">eBay Seller Hub Transaction Report — paid orders deduct from Inventory (including bundle components); refund lines restore stock &amp; reverse COGS (optional, toggle below). Claims/adjustments still excluded.<\u002Fdiv>\n            <label style=\"margin-top:4px; padding:8px 16px; border-radius:8px; background:var(--acc-soft); color:var(--acc-deep); font-size:12.5px; font-weight:700; cursor:pointer;\">\n              Choose file\n              <input type=\"file\" accept=\".csv\" sc-camel-on-change=\"{{ handleTxFile }}\" style=\"display:none;\">\n            <\u002Flabel>\n            <div style=\"font-size:12px; color:var(--mut);\">{{ txFileName }}<\u002Fdiv>\n            <label style=\"display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink2); cursor:pointer;\">\n              <input type=\"checkbox\" checked=\"{{ refundRestoreStock }}\" sc-camel-on-change=\"{{ toggleRefundRestore }}\" style=\"accent-color:var(--acc); width:14px; height:14px; cursor:pointer;\">\n              Refunds return items to stock\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"background:var(--card); border:1px dashed var(--bd3); border-radius:14px; padding:22px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;\">\n            <div style=\"font-weight:700; font-size:14px;\">Total Order Report (CSV)<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--mut);\">eBay All Orders Report — every order line (channel, SKU, qty, total) populates Sales Orders and everything derived from it.<\u002Fdiv>\n            <label style=\"margin-top:4px; padding:8px 16px; bord al looks too low because the rows behind it were counted during an earlier import. Stock, COGS and sales orders are not touched.<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ rebuildClick }}\" style=\"padding:9px 17px; border-radius:9px; border:1px solid var(--bd2); background:{{ rebuildBg }}; color:{{ rebuildColor }}; font-size:12.5px; font-weight:700; cursor:{{ rebuildCursor }}; white-space:nowrap;\">Rebuild totals<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 18px; border-radius:12px; background:var(--card); border:1px solid var(--bd); margin-top:14px; flex-wrap:wrap; row-gap:10px;\">\n          <div style=\"min-width:260px;\">\n            <div style=\"font-size:13.5px; font-weight:700;\">Clear this browser's cached figures<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--mut); margin-top:3px; line-height:1.5;\">Filed VAT period snapshots, the missing-cost list, the price uplift log and cached sale costs are held in this browser as well as the database. Clear them when starting fresh, after running the reset script. Your sign-in and theme are kept.<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ clearLocalCacheClick }}\" style=\"padding:9px 17px; border-radius:9px; border:1px solid var(--red-bd); background:var(--red-soft); color:var(--red-deep); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;\">Clear cache<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:18px;\">\n          <div sc-camel-on-click=\"{{ prevReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">←<\u002Fdiv>\n          <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; min-width:140px; text-align:center;\">{{ reportMonthLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">→<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasAlerts }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap;\">\n            <sc-for list=\"{{ alerts }}\" as=\"al\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; background:{{ al.bg }}; border:1px solid {{ al.border }};\">\n                <div style=\"width:7px; height:7px; border-radius:50%; background:{{ al.dot }};\"><\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:600; color:{{ al.color }};\">{{ al.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:grid; grid-template-columns:{{ kpiGridCols }}; gap:16px; margin-bottom:24px;\">\n          <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:8px; animation:rise .35s ease both;\" style-hover=\"transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--acc-bd);\">\n              <div style=\"width:26px; height:5px; border-radius:3px; background:{{ k.accent }};\"><\u002Fdiv>\n              <div style=\"font-size:12.5px; font-weight:600; color:var(--mut);\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-size:24px; font-weight:800; letter-spacing:-0.02em;\">{{ k.value }}<\u002Fdiv>\n w stock alerts<\u002Fdiv>\n              <div style=\"font-size:12px; font-weight:700; padding:4px 9px; border-radius:7px; background:var(--red-soft); color:var(--red);\">{{ lowStockCount }} SKUs<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <sc-for list=\"{{ lowStockItems }}\" as=\"i\" hint-placeholder-count=\"4\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:9px; background:var(--bg);\">\n                  <div>\n                    <div style=\"font-size:13.5px; font-weight:700;\">{{ i.name }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:var(--mut); margin-top:2px;\">{{ i.sku }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"text-align:right;\">\n                    <div style=\"font-size:13px; font-weight:700; color:var(--red);\">{{ i.stock }} left<\u002Fdiv>\n                    <div style=\"font-size:11px; color:var(--mut); margin-top:2px;\">Reorder by {{ i.reorderBy.text }} (est.)<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;\">\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px;\">Best product this month<\u002Fdiv>\n              <sc-if value=\"{{ hasBestProduct }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12px; font-weight:700; padding:4px 9px; border-radius:7px; background:var(--acc-soft); color:var(--acc-text);\">{{ bestProduct.pctOfSalesFmt }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if valu      <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ exportInventoryClick }}\" style=\"padding:10px 16px; border-radius:9px; border:1px solid var(--bd); font-size:13.5px; font-weight:700; background:var(--card); cursor:pointer; white-space:nowrap;\">Export CSV<\u002Fdiv>\n          <label style=\"padding:10px 16px; border-radius:9px; border:1px solid var(--bd); font-size:13.5px; font-weight:700; background:var(--card); cursor:pointer; white-space:nowrap;\">Import CSV<input type=\"file\" accept=\".csv\" sc-camel-on-change=\"{{ handleInventoryImportFile }}\" style=\"display:none;\"><\u002Flabel>\n          <div sc-camel-on-click=\"{{ openCycleCountClick }}\" style=\"padding:10px 16px; border-radius:9px; border:1px solid var(--bd); font-size:13.5px; font-weight:700; background:var(--card); cursor:pointer; white-space:nowrap;\">Cycle Count<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ openAddProductClick }}\" style=\"padding:10px 18px; border-radius:9px; background:var(--acc); color:white; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;\">Add Product<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px;\">\n          <div style=\"font-size:12px; font-weight:600; color:var(--mut);\">Inventory accuracy (last {{ stockCountSampleSize }} counts):<\u002Fdiv>\n          <div style=\"font-size:13px; font-weight:800; color:{{ inventoryAccuracyColor }};\">{{ inventoryAccuracyFmt }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasStockCounts }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:12px 16px; margin-bottom:14px; display:flex; flex-direction:column; gap:6px;\">\n            <div style=\"font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.03em;\">Recent cycle counts<\u002Fdiv>\n            <sc-for list=\"{{ recentStockCounts }} ; padding:24px; display:flex; flex-direction:column; gap:16px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n                <div style=\"font-weight:800; font-size:17px;\">{{ poModalTitle }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ closeAddPOClick }}\" style=\"cursor:pointer; font-size:13px; font-weight:700; color:var(--mut);\">Close<\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ poEditingReceived }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:11px 14px; border-radius:10px; border:1px solid var(--amb-bd); background:var(--amb-soft); font-size:12.5px; font-weight:600; color:var(--amb-deep); line-height:1.5;\">This purchase order is already received. Saving will reverse the stock and cost batches it added, then re-apply the new quantities and prices.<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ poShowHistToggle }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ togglePOHistorical }}\" style=\"display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:10px; border:1.5px solid {{ poHistBorder }}; background:{{ poHistBg }}; cursor:pointer;\">\n                  <div style=\"width:34px; height:19px; border-radius:10px; background:{{ poHistKnobBg }}; position:relative; transition:background .15s; flex-shrink:0;\">\n                    <div style=\"position:absolute; top:2px; left:{{ poHistKnobLeft }}; width:15px; height:15px; border-radius:50%; background:white; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.3);\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:1px;\">\n                    <div style=\"font-size:13px; font-weight:700;\">Historical PO — record only<\u002Fdiv>\n                    <div style=\"font-size:11.5px; color:var(--mut);\">Saved as Received for cost history &amp; supplier records. Stock is NOT added to inventory.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:grid; grid-template-columns:{{ responsiveCols2 }}; gap:12px;\">\n                <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Supplier<\u002Fdiv>\n                  <sc-raw-select value=\"{{ poNewSupplier }}\" sc-camel-on-change=\"{{ setPONewSupplier }}\" style=\"padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; background:var(--card);\">\n                    <option value=\"\">Select supplier…<\u002Foption>\n                    <sc-for list=\"{{ supplierNames }}\" as=\"sn\" hint-placeholder-count=\"3\">\n                      <option value=\"{{ sn }}\">{{ sn }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Order date<\u002Fdiv>\n                  <input type=\"date\" value=\"{{ poNewDate }}\" sc-camel-on-change=\"{{ setPONewDate }}\" style=\"padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px;\">\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:5px; opacity:{{ poStatusOpacity }};\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Status<\u002Fdiv>\n                  <sc-raw-select value=\"{{ poNewStatus }}\" sc-camel-on-change=\"{{ setPONewStatus }}\" disabled=\"{{ poHistorical }}\" style=\"padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; background:var(--card);\">\n                    <sc-for list=\"{{ poStatuses }}\" as=\"st\" hint-placeholder-count=\"4\">\n (--mut);\">{{ reconSummaryLine }}<\u002Fdiv>\n            <sc-if value=\"{{ hasReconMismatches }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-top:1px solid var(--dv); margin-top:12px; padding-top:12px; display:flex; flex-direction:column; gap:8px;\">\n                <sc-for list=\"{{ reconMismatchRows }}\" as=\"rm\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex; align-items:center; justify-content:space-between; font-size:12.5px; gap:10px;\">\n                    <div><span style=\"font-weight:700;\">{{ rm.order }}<\u002Fspan> <span style=\"color:var(--mut);\">{{ rm.sku }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"color:var(--mut); text-align:right;\">we said <span style=\"font-weight:700; color:var(--ink);\">{{ rm.computed }}<\u002Fspan> · eBay says <span style=\"font-weight:700; color:var(--amb-deep);\">{{ rm.actual }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ hasMoreMismatches }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:12px; color:var(--mut);\">+{{ extraMismatchCount }} more — adjust the SKU's rule below or in Add/Edit Product.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow-x:auto; overflow-y:hidden;\">\n          <div style=\"padding:16px 18px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; border-bottom:1px solid var(--dv);\">SKU classification (plug in name always overrides to RM48)<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 18px; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em; min-width:420px; background:var(--bg);\">\n :var(--acc-text); font-weight:600; flex:1; min-width:220px;\">True profit after eBay fees, cost of goods, postage, and all other expenses.<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:8px;\">\n            <div style=\"font-size:12.5px; font-weight:600; color:var(--acc-text);\">eBay fee rate<\u002Fdiv>\n            <input value=\"{{ feeRatePct }}\" sc-camel-on-change=\"{{ setFeeRatePct }}\" style=\"width:60px; padding:7px 9px; border-radius:7px; border:1px solid var(--acc-bd); font-size:13px;\">\n            <div style=\"font-size:12.5px; color:var(--acc-text);\">%<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:{{ kpiGridCols }}; gap:14px; margin-bottom:20px;\">\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px;\">\n            <div style=\"font-size:12px; font-weight:600; color:var(--mut); margin-bottom:6px;\">Projected next month<\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:20px;\">{{ projectedNextMonthFmt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px;\">\n            <div style=\"font-size:12px; font-weight:600; color:var(--mut); margin-bottom:6px;\">Gross sales<\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:20px;\">{{ grossSalesFmt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px;\">\n            <div style=\"font-size:12px; font-weight:600; color:var(--mut); margin-bottom:6px;\">Total net profit<\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:20px; color:{{ totalNetProfitColor }};\">{{ totalNetProfitFmt }}<\u002Fdiv>\n          <\u002Fd
