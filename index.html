n      let n = String(i.name || i.sku);\n      n = n.replace(/\\b(for\\s+)?(iphone|ipad|samsung|galaxy|pixel|airpods?|watch)\\b[\\s\\w().+/-]*$/i, '').trim();\n      n = n.replace(/[\\s,–-]+$/, '').trim();\n      return n || String(i.name || i.sku);\n    };\n    const spAgg = {};\n    salesOrdersMonth.forEach(s => {\n      const sku = s.sku || '—';\n      const amt = parseFloat(String(s.total).replace(/[£,]/g, '')) || 0;\n      const a = spAgg[sku] = spAgg[sku] || { units: 0, revenue: 0 };\n      if (s.status === 'Refunded') { a.revenue -= amt; } else { a.units += s.qty || 0; a.revenue += amt; }\n    });\n    const spTotalUnits = Object.values(spAgg).reduce((s2, a) => s2 + a.units, 0) || 1;\n    const spTotalRevenue = Object.values(spAgg).reduce((s2, a) => s2 + a.revenue, 0) || 1;\n    const fifoSkuCogs = this.state.cogsBySkuMonth[reportMonth] || {};\n    const spCogsOf = (invItem, units, soldSku) => {\n      if (fifoSkuCogs[soldSku] != null) return fifoSkuCogs[soldSku]; // actual FIFO consumption recorded at upload time\n      if (!invItem) {\n        const oldInv = this.state.oldInventory.find(o => o.sku.toLowerCase() === String(soldSku).toLowerCase());\n        return oldInv ? (oldInv.cost || 0) * units : 0;\n      }\n      if (invItem.components && invItem.components.length) {\n        return invItem.components.reduce((s2, c) => { const comp = this.state.inventory.find(x => x.sku === c.sku); return s2 + (comp ? (comp.cost || 0) * c.qty * units : 0); }, 0);\n      }\n      return (invItem.cost || 0) * units;\n    };\n    const skuProfitUsesFifo = Object.keys(fifoSkuCogs).length > 0;\n    const actualFeesBySku = this.state.feesBySkuMonth[reportMonth] || {};\n    const attributedFeesTotal = Object.values(actualFeesBySku).reduce((s2, v) => s2 + v, 0);\n    const unattributedFees = Math.max(0, ebayFees - attributedFeesTotal); // promoted listings & other non-order fees\n    const skuProfitUsesFees = Object.keys(actualFeesBySku).length > 0;\n    const famMap = {};\n    Object.keys(spAgg).forEach(sku => {\n      const invItem = this.state.inventory.find(i => i.sku.toLowerCase() === sku.toLowerCase());\n      const fam = invItem ? familyOf(invItem) : 'Unmatched SKUs';\n      const a = spAgg[sku];\n      const skuCogs = spCogsOf(invItem, a.units, invItem ? invItem.sku : sku);\n      const revShare = spTotalRevenue > 0 ? Math.max(0, a.revenue) / spTotalRevenue : 0;\n      const skuFees = skuProfitUsesFees ? (actualFeesBySku[sku] || 0) + unattributedFees * revShare : ebayFees * revShare;\n      const skuPost = postageForProfit * (a.units / spTotalUnits);\n      const profit = a.revenue - skuCogs - skuFees - skuPost;\n      const f = famMap[fam] = famMap[fam] || { name: fam, units: 0, revenue: 0, cogs: 0, profit: 0, skus: [] };\n      f.units += a.units; f.revenue += a.revenue; f.cogs += skuCogs; f.profit += profit;\n      const oldInvForSku = !invItem ? this.state.oldInventory.find(o => o.sku.toLowerCase() === sku.toLowerCase()) : null;\n      const needsCost = invItem ? (!(invItem.cost > 0) && !(invItem.components && invItem.components.length)) : !(oldInvForSku && oldInvForSku.cost > 0);\n      f.skus.push({ sku, name: invItem ? invItem.name : (oldInvForSku ? oldInvForSku.name : sku), units: a.units, revenue: a.revenue, cogs: skuCogs, profit, stock: invItem ? invItem.stock : null, needsCost });\n    });\n    const famList = Object.values(famMap).sort((a, b) => {\n      const aU = a.name === 'Unmatched SKUs' ? 1 : 0, bU = b.name === 'Unmatched SKUs' ? 1 : 0;\n      if (aU !== bU) return bU - aU;\n      return b.revenue - a.revenue;\n    });\n    const famMaxRev = Math.max(1, ...famList.map(f => f.revenue));\n    const fmtGBP = v => (v < 0 ? '-£' + Math.abs(v).toFixed(2) : '£' + v.toFixed(2));\n    const skuProfitFamilies = famList.map(f => {\n      const expanded = !!this.state.expandedFamilies[f.name];\n      const needsCostSkus = f.skus.filter(s => s.needsCost).map(s => s.sku);\n      const isUnmatched = f.name === 'Unmatched SKUs';\n      return {\n        name: f.name, skuCount: f.skus.length + ' SKU' + (f.skus.length === 1 ? '' : 's'), units: f.units,\n        revenueFmt: fmtGBP(f.revenue), cogsFmt: fmtGBP(f.cogs), profitFmt: fmtGBP(f.profit),\n        marginFmt: f.revenue > 0 ? ((f.profit / f.revenue) * 100).toFixed(1) + '%' : '—',\n        profitColor: f.profit >= 0 ? 'var(--grn)' : 'var(--red)',\n        barPct: ((Math.max(0, f.revenue) / famMaxRev) * 100).toFixed(1) + '%',\n        chev: expanded ? '▾' : '▸', toggle: () => this.toggleFamily(f.name), expanded,\n        cardBorder: isUnmatched ? 'var(--amb-bd)' : 'var(--bd)',\n        hasNeedsCost: needsCostSkus.length > 0,\n        needsCostLabel: needsCostSkus.length + ' SKU' + (needsCostSkus.length === 1 ? '' : 's') + ' need' + (needsCostSkus.length === 1 ? 's' : '') + ' a cost',\n        fixCostClick: e => { e.stopPropagation(); this.openFamilyCostEntry(needsCostSkus); },\n        skus: expanded ? [...f.skus].sort((x, y) => y.revenue - x.revenue).map(r => ({\n          sku: r.sku, name: r.name, units: r.units, revenueFmt: fmtGBP(r.revenue), cogsFmt: fmtGBP(r.cogs),\n          profitFmt: fmtGBP(r.profit), marginFmt: r.revenue > 0 ? ((r.profit / r.revenue) * 100).toFixed(1) + '%' : '—',\n          profitColor: r.profit >= 0 ? 'var(--grn)' : 'var(--red)',\n          stockFmt: r.stock != null ? r.stock + ' in stock' : 'not in inventory',\n          needsCost: r.needsCost, fixOneClick: e => { e.stopPropagation(); this.openFamilyCostEntry([r.sku]); },\n        })) : [],\n      };\n    });\n    const skuProfitSummary = [\n      { label: 'Product families', value: String(famList.length) },\n      { label: 'Net revenue', value: fmtGBP(famList.reduce((s2, f) => s2 + f.revenue, 0)) },\n      { label: 'COGS (est.)', value: fmtGBP(famList.reduce((s2, f) => s2 + f.cogs, 0)) },\n      { label: 'Profit after fees & postage', value: fmtGBP(famList.reduce((s2, f) => s2 + f.profit, 0)) },\n    ];\n    const hasSkuProfit = famList.length > 0;\n    const skuProfitNote = 'Grouped by product family, then SKU. COGS ' + (skuProfitUsesFifo ? 'is actual FIFO batch cost recorded when each report was processed (flat cost only for SKUs sold before FIFO tracking)' : 'uses current flat cost per SKU (upload a Transaction Report to switch to actual FIFO)') + '; ' + (skuProfitUsesFees ? 'fees are actual per-order fees from your report (promoted-listing/other fees spread by revenue share)' : feesIsActual ? 'fees are actual monthly total, allocated by revenue share' : 'fees estimated at ' + this.state.feeRatePct + '%, allocated by revenue share') + '; postage ' + (postageIsActual ? 'is actual label spend' : 'is estimated') + ', allocated by units.';\n    const rcvRowsVals = this.state.rcvRows.map(r => ({ ...r, setNow: e => this.setRcvQty(r.sku, e.target.value) }));\n\n    const nowMs = Date.now();\n    const lastSaleBySku = {};\n    this.state.salesOrders.forEach(s => {\n      if (s.status === 'Refunded') return;\n      const d = this.parseOrderDate(s.date);\n      if (!d) return;\n      const soldSkuItem = this.state.inventory.find(i => i.sku.toLowerCase() === String(s.sku || '').toLowerCase());\n      const creditSale = (sku) => { const t = d.getTime(); if (!lastSaleBySku[sku] || t > lastSaleBySku[sku]) lastSaleBySku[sku] = t; };\n      if (soldSkuItem) {\n        creditSale(soldSkuItem.sku);\n        (soldSkuItem.components || []).forEach(c => creditSale(c.sku)); // bundle sales keep components alive\n      } else if (s.sku) creditSale(s.sku);\n    });\n    const deadRows = this.state.inventory\n      .filter(i => !(i.components && i.components.length) && (i.stock || 0) > 0)\n      .map(i => {\n        const last = lastSaleBySku[i.sku];\n        const daysSince = last ? Math.floor((nowMs - last) / 86400000) : null;\n        const tied = (i.stock || 0) * (i.cost || 0);\n        return { ...i, daysSince, tied };\n      })\n      .filter(r => r.daysSince == null || r.daysSince >= 30)\n      .sort((a, b) => (b.daysSince == null ? 9999 : b.daysSince) - (a.daysSince == null ? 9999 : a.daysSince) || b.tied - a.tied);\n    const bandOf = ds => ds == null ? { label: 'Never sold', color: 'var(--red)', bg: 'var(--red-soft)' } : ds >= 90 ? { label: '90d+', color: 'var(--red)', bg: 'var(--red-soft)' } : ds >= 60 ? { label: '60–89d', color: 'var(--amb-deep)', bg: 'var(--amb-soft)' } : { label: '30–59d', color: 'var(--mut)', bg: 'var(--soft)' };\n    const deadTiedTotal = deadRows.reduce((s2, r) => s2 + r.tied, 0);\n    const deadStockRows = deadRows.map(r => {\n      const b = bandOf(r.daysSince);\n      return {\n        sku: r.sku, name: r.name, stock: r.stock,\n        lastSaleFmt: r.daysSince == null ? 'no sales recorded' : r.daysSince + ' days ago',\n        bandLabel: b.label, bandColor: b.color, bandBg: b.bg,\n        tiedFmt: '£' + r.tied.toFixed(2),\n        pctOfTied: deadTiedTotal > 0 ? ((r.tied / deadTiedTotal) * 100).toFixed(0) + '%' : '0%',\n        barPct: deadTiedTotal > 0 ? Math.max(1.5, (r.tied / deadTiedTotal) * 100).toFixed(1) + '%' : '0%',\n      };\n    });\n    const hasDeadStock = deadStockRows.length > 0;\n    const deadStockKpis = [\n      { label: 'Slow / dead SKUs (30d+ no sales)', value: String(deadRows.length) },\n      { label: 'Cash tied up (at cost)', value: '£' + deadTiedTotal.toFixed(2) },\n      { label: 'Worst offender', value: deadRows.length ? deadRows[0].sku : '—' },\n      { label: '90d+ / never sold', value: String(deadRows.filter(r => r.daysSince == null || r.daysSince >= 90).length) },\n    ];\n    const postageBannerLabel = 'Total postage — ' + reportMonthLabel + ' (eBay labels + Royal Mail)';\n    const postageBannerValue = '£' + postageForProfit.toFixed(2);\n    // Orders shipped and spend per service, side by side with what eBay charged directly.\n    const shippedRows = [\n      { label: 'RM Large Letter', orders: String(llCount), rate: '£' + llRate.toFixed(2), value: '£' + llCost.toFixed(2), color: 'var(--acc-deep)' },\n      { label: 'RM Tracked 48', orders: String(t48Count), rate: '£' + t48Rate.toFixed(2), value: '£' + t48Cost.toFixed(2), color: 'var(--teal-deep)' },\n      { label: 'eBay-bought labels', orders: '—', rate: 'from report', value: '£' + ebayLabelSpend.toFixed(2), color: 'var(--mut)' },\n    ];\n    const shippedTotalOrders = String(llCount + t48Count);\n    const shippedTotalValue = '£' + postageForProfit.toFixed(2);\n\n    // Cash flow: committed (open POs) vs paid (received) vs incoming revenue\n    const cfCommitted = purchaseOrdersAll.filter(p => p.status !== 'Received').reduce((s, p) => s + p.lines.reduce((ls, l) => ls + l.qty * this.lineGbp(l), 0), 0);\n    const cfPaid = purchaseOrdersAll.filter(p => p.status === 'Received').reduce((s, p) => s + p.lines.reduce((ls, l) => ls + l.qty * this.lineGbp(l), 0), 0);\n    const cfOutflow = cfPaid + postageCostTotal + otherExpensesTotal;\n    const cfNetPosition = grossSales - cfOutflow - cfCommitted;\n    const cashflowKpis = [\n      { label: 'Incoming revenue (MTD) — actual', value: '£' + grossSales.toFixed(2), color: 'var(--acc)' },\n      { label: 'Committed (open POs) — planned', value: '£' + cfCommitted.toFixed(2), color: 'var(--amb)' },\n      { label: 'Paid out (received POs + costs) — actual', value: '£' + cfOutflow.toFixed(2), color: 'var(--red)' },\n      { label: 'Net cash position', value: '£' + cfNetPosition.toFixed(2), color: cfNetPosition >= 0 ? 'var(--grn)' : 'var(--red)' },\n    ];\n    const cashflowPOs = purchaseOrdersAll.filter(p => p.status !== 'Received').map(p => ({\n      id: p.id, supplier: p.supplier, orderDate: p.orderDate, status: p.status, totalFmt: p.totalFmt, statusBg: p.statusBg, statusColor: p.statusColor,\n    }));\n\n    // PO commitments trend: reuses the Overview trend's month scaffolding (trendMonths) to show\n    // committed (still-open) vs. received PO value by the month each PO was placed.\n    const cfTrendAgg = {};\n    purchaseOrdersAll.forEach(p => {\n      const k = this.orderMonthKey(p.orderDate);\n      if (!k) return;\n      if (!cfTrendAgg[k]) cfTrendAgg[k] = { committed: 0, paid: 0 };\n      const val = p.lines.reduce((ls, l) => ls + l.qty * this.lineGbp(l), 0);\n      if (p.status === 'Received') cfTrendAgg[k].paid += val; else cfTrendAgg[k].committed += val;\n    });\n    const cfTrendPts = trendMonths.map(m => {\n      const a = cfTrendAgg[m.key] || { committed: 0, paid: 0 };\n      return { label: m.label, committed: a.committed, paid: a.paid };\n    });\n    const cfTrendMax = Math.max(1, ...cfTrendPts.map(p => p.committed + p.paid));\n    const cfTrendBars = cfTrendPts.map(p => ({\n      label: p.label,\n      committedPct: ((p.committed / cfTrendMax) * 100).toFixed(1) + '%',\n      paidPct: ((p.paid / cfTrendMax) * 100).toFixed(1) + '%',\n      totalFmt: '£' + (p.committed + p.paid).toFixed(0),\n    }));\n    const hasCfTrend = cfTrendPts.some(p => p.committed + p.paid > 0);\n\n    // Channel breakdown (Reports)\n    const channelAgg = {};\n    salesOrdersMonth.forEach(s => {\n      const ch = s.channel || 'Other';\n      if (!channelAgg[ch]) channelAgg[ch] = { revenue: 0, orders: 0 };\n      channelAgg[ch].revenue += parseFloat(String(s.total).replace(/[£,]/g, '')) || 0;\n      channelAgg[ch].orders += 1;\n    });\n    const channelBreakdown = Object.entries(channelAgg).map(([name, a]) => ({\n      name, revenueFmt: '£' + a.revenue.toFixed(2), orders: a.orders,\n      pct: (reportGrossSales > 0 ? (a.revenue / reportGrossSales) * 100 : 0).toFixed(1) + '%',\n    })).sort((a, b) => parseFloat(b.revenueFmt.slice(1)) - parseFloat(a.revenueFmt.slice(1)));\n\n    const profitWaterfall = [\n      { label: 'Gross sales', value: '£' + grossSales.toFixed(2), bold: '400' },\n      { label: feesIsActual ? 'eBay fees — actual (from report)' : 'eBay fees — estimated (' + this.state.feeRatePct + '%)', value: '-£' + ebayFees.toFixed(2), bold: '400' },\n      { label: 'Net revenue (after fees)', value: '£' + netRevenue.toFixed(2), bold: '800' },\n      { label: 'Cost o
