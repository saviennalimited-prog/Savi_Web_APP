Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column;\">\n            <sc-for list=\"{{ profitWaterfall }}\" as=\"w\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-top:1px solid var(--dv); font-size:14px;\">\n                <div style=\"font-weight:{{ w.bold }};\">{{ w.label }}<\u002Fdiv>\n                <div style=\"font-weight:700; color:var(--ink2);\">{{ w.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasMarginTrend }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px; margin-bottom:20px;\">\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px; margin-bottom:8px;\">Net margin trend — last 6 months<\u002Fdiv>\n            <svg sc-camel-view-box=\"0 0 600 156\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%; height:170px; display:block;\">\n              <path d=\"{{ marginPath }}\" sc-camel-path-length=\"880\" style=\"fill:none; stroke:var(--grn); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:900; animation:draw 1.1s ease forwards;\"><\u002Fpath>\n            <\u002Fsvg>\n            <div style=\"display:flex; justify-content:space-between; margin-top:8px;\">\n              <sc-for list=\"{{ marginTrendLabels }}\" as=\"m\" hint-placeholder-count=\"6\">\n                <div style=\"text-align:center;\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">{{ m.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:var(--mut2); margin-top:1px;\">{{ m.marginFmt }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow-x:auto; overflow-y:hidden; margin-bottom:20px;\">\n          <div style=\"padding:16px 18px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; border-bottom:1px solid var(--dv);\">Margin by SKU<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1.6fr 0.8fr 0.8fr 0.8fr; gap:8px; padding:10px 18px; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em; min-width:560px; background:var(--bg);\">\n            <div>Product / SKU<\u002Fdiv><div>Revenue<\u002Fdiv><div>COGS<\u002Fdiv><div>Margin<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ skuMargins }}\" as=\"m\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid; grid-template-columns:1.6fr 0.8fr 0.8fr 0.8fr; gap:8px; align-items:center; padding:11px 18px; font-size:13px; border-top:1px solid var(--dv); min-width:560px;\">\n              <div>\n                <div style=\"font-weight:700;\">{{ m.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px; color:var(--mut); margin-top:1px;\">{{ m.sku }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>{{ m.revenueFmt }}<\u002Fdiv>\n              <div style=\"color:var(--mut);\">{{ m.cogsFmt }}<\u002Fdiv>\n              <div style=\"font-weight:700; color:{{ m.marginColor }};\">{{ m.marginFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow:hidden;\">\n          <div style=\"padding:16px 18px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; border-bottom:1px solid var(--dv);\">Other expenses deducted<\u002Fdiv>\n          <sc-for list=\"{{ expensesList }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; padding:12px 18px; font-size:13.5px; border-top:1px solid var(--dv);\">\n              <div>{{ e.name }} <span style=\"color:var(--mut); font-size:12px;\">({{ e.category }})<\u002Fspan><\u002Fdiv>\n              <div style=\"font-weight:700;\">{{ e.amountFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOtherExp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:18px;\">\n          <div sc-camel-on-click=\"{{ prevExpenseMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">‹<\u002Fdiv>\n          <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; min-width:140px; text-align:center;\">{{ expenseMonthLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextExpenseMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">›<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px; margin-bottom:20px;\">\n          <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px; margin-bottom:14px;\">Add an expense<\u002Fdiv>\n          <div style=\"display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;\">\n            <div style=\"display:flex; flex-direction:column; gap:5px;\">\n              <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Name<\u002Fdiv>\n              <input value=\"{{ newName }}\" sc-camel-on-change=\"{{ setNewName }}\" placeholder=\"e.g. Warehouse rent\" style=\"width:220px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px;\">\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:5px;\">\n              <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Category<\u002Fdiv>\n              <sc-raw-select value=\"{{ newCategory }}\" sc-camel-on-change=\"{{ setNewCategory }}\" style=\"width:170px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; background:var(--card);\">\n                <sc-for list=\"{{ expenseCategories }}\" as=\"c\" hint-placeholder-count=\"7\">\n                  <option value=\"{{ c }}\">{{ c }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isOtherCategory }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Custom category<\u002Fdiv>\n                <input value=\"{{ newCustomCategory }}\" sc-camel-on-change=\"{{ setNewCustomCategory }}\" placeholder=\"Name it…\" style=\"width:160px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px;\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex; flex-direction:column; gap:5px;\">\n              <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Amount (£)<\u002Fdiv>\n              <input value=\"{{ newAmount }}\" sc-camel-on-change=\"{{ setNewAmount }}\" placeholder=\"0.00\" style=\"width:110px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px;\">\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:5px;\">\n              <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Frequency<\u002Fdiv>\n              <sc-raw-select value=\"{{ newType }}\" sc-camel-on-change=\"{{ setNewType }}\" style=\"width:140px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; background:var(--card);\">\n                <option value=\"One-time\">One-time<\u002Foption>\n                <option value=\"Monthly\">Monthly<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:5px;\">\n              <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">VAT<\u002Fdiv>\n              <sc-raw-select value=\"{{ newVatStatus }}\" sc-camel-on-change=\"{{ setNewVatStatus }}\" style=\"width:150px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; background:var(--card);\">\n                <option value=\"No VAT\">No VAT<\u002Foption>\n                <option value=\"VAT paid\">VAT paid<\u002Foption>\n                <option value=\"Exempt\">Exempt<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ addExpenseClick }}\" style=\"padding:10px 20px; border-radius:9px; background:var(--acc); color:white; font-size:13.5px; font-weight:700; cursor:pointer;\">Add<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:{{ responsiveCols2 }}; gap:20px;\">\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow:hidden;\">\n            <div style=\"padding:16px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--dv);\">\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px;\">All expenses<\u002Fdiv>\n              <div style=\"text-align:right;\">\n                <div style=\"font-weight:800; font-family:'Plus Jakarta Sans',sans-serif;\">{{ otherExpensesTotal }}<\u002Fdiv>\n                <sc-if value=\"{{ expenseVatOn }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--grn); margin-top:2px;\">{{ expenseVatTotalFmt }} VAT reclaimable<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ expensesList }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 18px; font-size:13.5px; border-top:1px solid var(--dv); flex-wrap:wrap; row-gap:8px;\">\n                <div style=\"min-width:120px;\">\n                  <div style=\"font-weight:700;\">{{ e.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px; color:var(--mut); margin-top:2px;\">{{ e.category }} · {{ e.type }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:10px; row-gap:6px;\">\n                  <sc-raw-select value=\"{{ e.vatStatus }}\" sc-camel-on-change=\"{{ e.setVatStatus }}\" style=\"padding:6px 9px; border-radius:7px; border:1px solid var(--bd2); font-size:12px; background:var(--card); color:var(--ink);\">\n                    <option value=\"No VAT\">No VAT<\u002Foption>\n                    <option value=\"VAT paid\">VAT paid<\u002Foption>\n                    <option value=\"Exempt\">Exempt<\u002Foption>\n                  <\u002Fsc-raw-select>\n                  <div style=\"text-align:right; font-size:12.5px; font-weight:700; color:{{ e.vatColor }};\">{{ e.vatFmt }}<\u002Fdiv>\n                  <div style=\"font-weight:700; text-align:right;\">{{ e.amountFmt }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ e.onRemove }}\" style=\"font-size:12px; font-weight:700; color:var(--red); cursor:pointer;\">Remove<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px;\">\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px; margin-bottom:14px;\">Breakdown by category<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:12px;\">\n              <sc-for list=\"{{ categoryBreakdown }}\" as=\"cb\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;\"><div style=\"font-weight:600;\">{{ cb.name }}<\u002Fdiv><div style=\"font-weight:700;\">{{ cb.total }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"height:8px; border-radius:5px; background:var(--dv); overflow:hidden;\">\n                    <div style=\"height:100%; border-radius:5px; background:var(--acc); width:{{ cb.pct }};\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTax }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ taxTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ t.click }}\" style=\"padding:9px 16px; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; background:{{ t.bg }}; color:{{ t.color }}; border:1px solid var(--bd); white-space:nowrap;\">{{ t.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ vatSchemaMissing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 18px; border-radius:12px; background:var(--amb-soft); border:1px solid var(--amb-bd); margin-bottom:18px; font-size:13px; color:var(--amb-deep); font-weight:600; line-height:1.6;\">\n            The VAT columns are missing from the database, so VAT choices are held in this browser only. Run <strong>vat_migration.sql<\u002Fstrong> in Supabase to store them properly — nothing else is affected until you do.\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; row-gap:10px;\">\n          <div sc-camel-on-click=\"{{ prevReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">←<\u002Fdiv>\n          <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; min-width:140px; text-align:center;\">{{ taxMonthLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">→<\u002Fdiv>\n          <sc-if value=\"{{ vatPartialMonth }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:6px 12px; border-radius:8px; background:var(--amb-soft); border:1px solid var(--amb-bd); font-size:12px; font-weight:700; color:var(--amb-deep);\">Part month — in scope from {{ vatStartDate }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ vatNotActiveYet }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:16px 20px; border-radius:12px; background:var(--soft); border:1px solid var(--bd); margin-bottom:20px; font-size:13.5px; color:var(--mut); font-weight:600; line-height:1.6;\">\n            This month is before your VAT start date of {{ vatStartDate }}, so there is no VAT to report. Everything here stays at zero until the registration date — nothing in the old figures is rewritten.\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTaxSummary }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid; grid-template-columns:{{ cfKpiGridCols }}; gap:16px; margin-bottom:22px;\">\n            <sc-for list=\"{{ taxKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:18px; border-top:3px solid {{ k.accent }};\">\n                <div style=\"font-size:12.5px; font-weight:700; color:var(--mut); margin-bottom:6px;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:25px; letter-spacing:-0.02em;\">{{ k.value }}<\u002Fdiv>\n                <div style=\"font-size:11.5px; color:var(--mut); margin-top:4px;\">{{ k.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:{{ responsiveCols2 }}; gap:20px; margin-bottom:20px;\">\n            <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow:hidden;\">\n              <div style=\"padding:16px 18px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; border-bottom:1px solid var(--dv);\">Output VAT — what you collected<\u002Fdiv>\n              <sc-for list=\"{{ vatSalesRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; padding:12px 18px; font-size:13.5px; border-top:1px solid var(--dv);\">\n                  <div style=\"font-weight:{{ r.bold }}; color:var(--ink2);\">{{ r.label }}<\u002Fdiv>\n                  <div style=\"font-weight:{{ r.bold }};\">{{ r.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:14px;\">\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px;\">VAT reserve<\u002Fdiv>\n              <div style=\"padding:13px 16px; border-radius:11px; background:{{ reserveWarnBg }}; font-size:12.5px; font-weight:600; color:{{ reserveWarnColor }}; line-height:1.6;\">{{ reserveWarnText }}<\u002Fdiv>\n              <div style=\"display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;\">\n                <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Amount set aside this month (£)<\u002Fdiv>\n                  <input value=\"{{ vatReserveInput }}\" sc-camel-on-change=\"{{ setVatReserveInput }}\" placeholder=\"0.00\" style=\"width:150px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px;\">\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ saveVatReserveClick }}\" style=\"padding:10px 18px; border-radius:9px; background:var(--acc); color:white; font-size:13px; font-weight:700; cursor:pointer;\">Record<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:16px;\">\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px;\">VAT settings<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--mut); line-height:1.6; max-width:640px;\">Your effective registration date comes from HMRC and may not be the 1st. Change it here and every page follows — VAT charged before it is not owed, and VAT paid before it is not reclaimable.<\u002Fdiv>\n            <div style=\"display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; row-gap:12px;\">\n              <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">VAT start date<\u002Fdiv>\n                <input type=\"date\" value=\"{{ vatStartDate }}\" sc-camel-on-change=\"{{ setVatStartDate }}\" style=\"width:170px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; background:var(--card); color:var(--ink);\">\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">Rate (%)<\u002Fdiv>\n                <input value=\"{{ vatRatePct }}\" sc-camel-on-change=\"{{ setVatRatePct }}\" style=\"width:90px; padding:9px 12px; border-radius:8px; border:1px solid var(--bd2); font-size:13px;\">\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ toggleVatEnabledClick }}\" style=\"display:flex; align-items:center; gap:9px; cursor:pointer; padding-bottom:9px;\">\n                <div style=\"width:34px; height:19px; border-radius:11px; background:{{ vatToggleBg }}; position:relative;\">\n                  <div style=\"position:absolute; top:2px; left:{{ vatToggleLeft }}; width:15px; height:15px; border-radius:50%; background:white;\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px; font-weight:700; color:var(--mut);\">VAT enabled<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTaxClaim }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 18px; border-radius:12px; background:var(--acc-soft); border:1px solid var(--acc-bd); margin-bottom:20px; font-size:13px; color:var(--acc-text); font-weight:600; line-height:1.6;\">\n            Where every reclaimable penny came from. VAT inside a price is the gross ÷ 6 — never the gross × 20%. Alibaba stock is absent on purpose: with no UK VAT invoice there is nothing to reclaim, which is why that 20% sits in your cost instead.\n          <\u002Fdiv>\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow-x:auto; overflow-y:hidden;\">\n            <div style=\"display:grid; grid-template-columns:1.7fr 0.9fr 0.9fr 0.9fr; gap:10px; padding:11px 18px; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em; background:var(--bg); min-width:600px;\">\n              <div>Source<\u002Fdiv><div>Gross paid<\u002Fdiv><div>VAT in it<\u002Fdiv><div>Net cost<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ claimableRows }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid; grid-template-columns:1.7fr 0.9fr 0.9fr 0.9fr; gap:10px; align-items:center; padding:12px 18px; font-size:13px; border-top:1px solid var(--dv); min-width:600px;\">\n                <div>\n                  <div style=\"font-weight:600;\">{{ c.source }}<\u002Fdiv>\n                  <sc-if value=\"{{ c.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px; color:var(--mut); margin-top:2px;\">{{ c.note }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div>{{ c.grossFmt }}<\u002Fdiv>\n                <div style=\"font-weight:700; color:{{ c.vatColor }};\">{{ c.vatFmt }}<\u002Fdiv>\n                <div style=\"color:var(--mut);\">{{ c.netFmt }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:grid; grid-template-columns:1.7fr 0.9fr 0.9fr 0.9fr; gap:10px; align-items:center; padding:14px 18px; font-size:13.5px; border-top:2px solid var(--bd); background:var(--soft); min-width:600px;\">\n              <div style=\"font-weight:800;\">Total claimable<\u002Fdiv>\n              <div style=\"font-weight:800;\">{{ claimableTotal.grossFmt }}<\u002Fdiv>\n              <div style=\"font-weight:800; color:var(--grn);\">{{ claimableTotal.vatFmt }}<\u002Fdiv>\n              <div style=\"font-weight:800;\">{{ claimableTotal.netFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTaxPeriods }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px 18px; border-radius:12px; background:var(--acc-soft); border:1px solid var(--acc-bd); margin-bottom:20px; font-size:13px; color:var(--acc-text); font-weight:600; line-height:1.6;\">\n            UK VAT returns are filed quarterly, so months are grouped into three-month periods running from your registration month. Marking a period Filed stores that quarter's figures as submitted and stops showing live ones — a later correction to a cost or postage rate is reported as a difference instead of quietly rewriting a number you have already given HMRC.\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px;\">\n            <sc-for list=\"{{ vatQuarterRows }}\" as=\"q\" hint-placeholder-count=\"1\">\n              <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow:hidden;\">\n                <div style=\"padding:15px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--dv); flex-wrap:wrap; row-gap:10px;\">\n                  <div style=\"display:flex; align-items:center; gap:11px; flex-wrap:wrap;\">\n                    <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:15.5px;\">{{ q.label }}<\u002Fdiv>\n                    <div style=\"padding:4px 10px; border-radius:7px; background:{{ q.statusBg }}; color:{{ q.statusColor }}; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;\">{{ q.status }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:9px;\">\n                    <sc-if value=\"{{ q.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div sc-camel-on-click=\"{{ q.fileClick }}\" style=\"padding:8px 15px; border-radius:8px; border:1px solid var(--bd2); font-size:12.5px; font-weight:700; cursor:pointer; background:var(--card);\">Mark filed<\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ q.isFiled }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div sc-camel-on-click=\"{{ q.paidClick }}\" style=\"padding:8px 15px; border-radius:8px; background:var(--grn); color:white; font-size:12.5px; font-weight:700; cursor:pointer;\">Mark paid<\u002Fdiv>\n                      <div sc-camel-on-click=\"{{ q.reopenClick }}\" style=\"padding:8px 13px; border-radius:8px; border:1px solid var(--bd2); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--mut);\">Reopen<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ q.isFrozen }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:11px 18px; background:var(--acc-soft); border-bottom:1px solid var(--acc-bd); font-size:12px; font-weight:600; color:var(--acc-text); line-height:1.55;\">{{ q.frozenNote }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ q.hasDrift }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:11px 18px; background:var(--amb-soft); border-bottom:1px solid var(--amb-bd); font-size:12px; font-weight:600; color:var(--amb-deep); line-height:1.55;\">{{ q.driftNote }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:grid; grid-template-columns:1.5fr 0.9fr 0.9fr 0.9fr; gap:10px; padding:10px 18px; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em; background:var(--bg);\">\n                  <div>Month<\u002Fdiv><div>Output VAT<\u002Fdiv><div>Claimable<\u002Fdiv><div>Net<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ q.months }}\" as=\"m\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid; grid-template-columns:1.5fr 0.9fr 0.9fr 0.9fr; gap:10px; align-items:center; padding:11px 18px; font-size:13px; border-top:1px solid var(--dv);\">\n                    <div>\n                      <div style=\"font-weight:600;\">{{ m.label }}<\u002Fdiv>\n                      <sc-if value=\"{{ m.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size:11.5px; color:var(--mut); margin-top:2px;\">{{ m.note }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div>{{ m.outputFmt }}<\u002Fdiv>\n                    <div style=\"color:var(--grn);\">{{ m.claimFmt }}<\u002Fdiv>\n                    <div style=\"font-weight:600;\">{{ m.netFmt }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:grid; grid-template-columns:1.5fr 0.9fr 0.9fr 0.9fr; gap:10px; align-items:center; padding:14px 18px; font-size:13.5px; border-top:2px solid var(--bd); background:var(--soft);\">\n                  <div style=\"font-weight:800;\">Period total<\u002Fdiv>\n                  <div style=\"font-weight:800;\">{{ q.outputFmt }}<\u002Fdiv>\n                  <div style=\"font-weight:800; color:var(--grn);\">{{ q.claimFmt }}<\u002Fdiv>\n                  <div style=\"font-weight:800; color:{{ q.netColor }};\">{{ q.netFmt }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTaxCutover }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px; margin-bottom:20px; display:flex; flex-direction:column; gap:14px;\">\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px;\">Price uplift<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--mut); line-height:1.6; max-width:680px;\">Raises every priced SKU by {{ vatRatePct }}% in one step so the buyer covers the VAT rather than your margin. Every run is logged per SKU, so Undo restores the exact previous price instead of dividing back and leaving rounding drift.<\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap;\">\n              <div sc-camel-on-click=\"{{ openUpliftClick }}\" style=\"padding:10px 18px; border-radius:9px; background:var(--acc); color:white; font-size:13.5px; font-weight:700; cursor:pointer;\">Uplift all prices ×{{ vatMultLabel }}<\u002Fdiv>\n              <sc-if value=\"{{ hasPendingUplift }}\" hint-placeholder-val=\"{{ false }}\">\n                <div sc-camel-on-click=\"{{ undoUpliftClick }}\" style=\"padding:10px 18px; border-radius:9px; border:1px solid var(--bd2); background:var(--card); font-size:13.5px; font-weight:700; cursor:pointer;\">Undo uplift<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--mut); font-weight:600;\">{{ pendingUpliftLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ noUpliftTargets }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:11px 14px; border-radius:9px; background:var(--amb-soft); border:1px solid var(--amb-bd); font-size:12.5px; font-weight:600; color:var(--amb-deep); line-height:1.6;\">Nothing to uplift: no SKU in Current Inventory carries a price. Your priced products sit in Old Inventory — import them into Inventory first, or set prices on eBay directly.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"padding:14px 18px; border-radius:12px; background:{{ cutoverNoteBg }}; border:1px solid {{ cutoverNoteBd }}; margin-bottom:20px; font-size:13px; color:{{ cutoverNoteColor }}; font-weight:600; line-height:1.6;\">\n            {{ cutoverNote }}\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasCutoverRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow-x:auto; overflow-y:hidden;\">\n              <div style=\"display:grid; grid-template-columns:1.7fr 0.8fr 0.8fr 0.8fr 0.7fr 0.9fr; gap:10px; padding:11px 18px; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em; background:var(--bg); min-width:760px;\">\n                <div>Product / SKU<\u002Fdiv><div>Price<\u002Fdiv><div>Profit now<\u002Fdiv><div>After VAT<\u002Fdiv><div>Margin<\u002Fdiv><div>Break-even price<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ cutoverRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid; grid-template-columns:1.7fr 0.8fr 0.8fr 0.8fr 0.7fr 0.9fr; gap:10px; align-items:center; padding:11px 18px; font-size:13px; border-top:1px solid var(--dv); background:{{ r.rowBg }}; min-width:760px;\">\n                  <div>\n                    <div style=\"font-weight:700;\">{{ r.name }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px; color:var(--mut); margin-top:1px;\">{{ r.sku }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>{{ r.priceFmt }}<\u002Fdiv>\n                  <div style=\"color:var(--mut);\">{{ r.nowFmt }}<\u002Fdiv>\n                  <div style=\"font-weight:700;\">{{ r.afterFmt }}<\u002Fdiv>\n                  <div style=\"font-weight:700; color:{{ r.marginColor }};\">{{ r.marginFmt }}<\u002Fdiv>\n                  <div style=\"color:var(--acc-text); font-weight:600;\">{{ r.fixPrice }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showUpliftModal }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed; inset:0; background:var(--ovl); display:flex; align-items:center; justify-content:center; z-index:1000;\">\n            <div style=\"width:520px; max-width:92vw; box-sizing:border-box; max-height:86vh; overflow-y:auto; background:var(--card); border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:16px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n                <div style=\"font-weight:800; font-size:17px;\">Uplift all prices ×{{ vatMultLabel }}<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ closeUpliftClick }}\" style=\"cursor:pointer; font-size:13px; font-weight:700; color:var(--mut);\">Close<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--mut); line-height:1.6;\">{{ upliftCount }} priced SKUs will change. The old price of every one is recorded, so Undo puts them back exactly — no rounding drift.<\u002Fdiv>\n              <div style=\"border:1px solid var(--bd); border-radius:11px; overflow:hidden;\">\n                <div style=\"padding:9px 14px; background:var(--bg); font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em;\">First three, as a check<\u002Fdiv>\n                <sc-for list=\"{{ upliftExamples }}\" as=\"u\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 14px; font-size:13px; border-top:1px solid var(--dv);\">\n                    <div style=\"min-width:0;\">\n                      <div style=\"font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ u.name }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px; color:var(--mut);\">{{ u.sku }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; align-items:center; gap:9px; flex-shrink:0;\">\n                      <div style=\"color:var(--mut);\">{{ u.oldFmt }}<\u002Fdiv>\n                      <div style=\"color:var(--mut);\">→<\u002Fdiv>\n                      <div style=\"font-weight:800;\">{{ u.newFmt }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex; justify-content:flex-end; gap:10px; border-top:1px solid var(--dv); padding-top:14px;\">\n                <div sc-camel-on-click=\"{{ closeUpliftClick }}\" style=\"padding:9px 18px; border-radius:8px; border:1px solid var(--bd2); font-size:13px; font-weight:700; cursor:pointer;\">Cancel<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ applyUpliftClick }}\" style=\"padding:9px 20px; border-radius:8px; background:var(--acc); color:white; font-size:13px; font-weight:700; cursor:pointer;\">Apply uplift<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCashFlow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; align-items:center; gap:12px; margin-bottom:18px;\">\n          <div sc-camel-on-click=\"{{ prevReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">←<\u002Fdiv>\n          <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; min-width:140px; text-align:center;\">{{ reportMonthLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ nextReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">→<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:16px 20px; border-radius:12px; background:var(--acc-soft); border:1px solid var(--acc-bd); margin-bottom:20px; font-size:13.5px; color:var(--acc-text); font-weight:600;\">\n          Incoming revenue vs. money committed to open purchase orders and already-paid costs.\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:{{ cfKpiGridCols }}; gap:16px; margin-bottom:24px;\">\n          <sc-for list=\"{{ cashflowKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n            <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:18px;\">\n              <div style=\"font-size:12.5px; font-weight:600; color:var(--mut); margin-bottom:8px;\">{{ k.label }}<\u002Fdiv>\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:22px; color:{{ k.color }};\">{{ k.value }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasCfTrend }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:20px; margin-bottom:20px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;\">\n              <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15.5px;\">PO commitments by month — last 6 months<\u002Fdiv>\n              <div style=\"display:flex; gap:14px; font-size:12px; font-weight:600; color:var(--mut);\">\n                <div style=\"display:flex; align-items:center; gap:6px;\"><div style=\"width:10px; height:10px; border-radius:2px; background:var(--amb);\"><\u002Fdiv>Committed (open)<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:6px;\"><div style=\"width:10px; height:10px; border-radius:2px; background:var(--grn-lite);\"><\u002Fdiv>Received<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:flex-end; gap:16px;\">\n              <sc-for list=\"{{ cfTrendBars }}\" as=\"cb\" hint-placeholder-count=\"6\">\n                <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;\">\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">{{ cb.totalFmt }}<\u002Fdiv>\n                  <div style=\"width:100%; max-width:48px; height:120px; border-radius:6px 6px 0 0; background:var(--soft); display:flex; flex-direction:column-reverse; overflow:hidden;\">\n                    <div style=\"width:100%; height:{{ cb.paidPct }}; background:var(--grn-lite);\"><\u002Fdiv>\n                    <div style=\"width:100%; height:{{ cb.committedPct }}; background:var(--amb);\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11.5px; font-weight:700; color:var(--mut);\">{{ cb.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:14px; overflow-x:auto; overflow-y:hidden;\">\n          <div style=\"padding:16px 18px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:15px; border-bottom:1px solid var(--dv);\">Open purchase order commitments<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1fr 1.2fr 1fr 0.8fr 0.8fr; gap:8px; padding:10px 18px; font-size:11px; font-weight:700; color:var(--mut); text-transform:uppercase; letter-spacing:0.04em; min-width:640px;\">\n            <div>PO #<\u002Fdiv><div>Supplier<\u002Fdiv><div>Order date<\u002Fdiv><div>Status<\u002Fdiv><div>Committed<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ cashflowPOs }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid; grid-template-columns:1fr 1.2fr 1fr 0.8fr 0.8fr; gap:8px; align-items:center; padding:12px 18px; font-size:13.5px; border-top:1px solid var(--dv); min-width:640px;\">\n              <div style=\"font-weight:700;\">{{ p.id }}<\u002Fdiv>\n              <div>{{ p.supplier }}<\u002Fdiv>\n              <div style=\"color:var(--mut);\">{{ p.orderDate }}<\u002Fdiv>\n              <div><span style=\"font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; background:{{ p.statusBg }}; color:{{ p.statusColor }};\">{{ p.status }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-weight:700;\">{{ p.totalFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReports }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <div sc-camel-on-click=\"{{ prevReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">←<\u002Fdiv>\n            <div style=\"font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:17px; min-width:140px; text-align:center;\">{{ reportMonthLabel }}<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ nextReportMonthClick }}\" style=\"padding:8px 14px; border-radius:8px; border:1px solid var(--bd); background:var(--card); font-size:13px; font-weight:700; cursor:pointer;\">→<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ savePdfClick }}\" style=\"padding:9px 16px; border-radius:9px; background:var(--toast); color:white; font-size:13px; font-weight:700; cursor:pointer;\">Save as PDF<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasTxSummary }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid; grid-template-columns:{{ cfKpiGridCols }}; gap:14px; margin-bottom:20px;\">\n            <sc-for list=\"{{ txSummaryCards }}\" as=\"tc\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px;\">\n                <div style=\ tate({ session });\n        if (session) this.loadAllData();\n      });\n    };\n    tryInit();\n  }\n\n  signIn() {\n    if (!this.sb) return;\n    this.setState({ authError: '' });\n    this.sb.auth.signInWithPassword({ email: this.state.authEmail, password: this.state.authPassword })\n      .then(({ error }) => { if (error) this.setState({ authError: error.message }); });\n  }\n  signOut() { if (this.sb) this.sb.auth.signOut(); this.setState({ showUserMenu: false }); }\n  toggleUserMenu() { this.setState(s => ({ showUserMenu: !s.showUserMenu })); }\n  toggleSidebar() { this.setState(s => ({ sidebarOpen: !s.sidebarOpen })); }\n  closeSidebarMobile() { if (this.state.winWidth < 900) this.setState({ sidebarOpen: false }); }\n  pushUndo(label, restoreFn) {\n    if (this._undoTimer) clearTimeout(this._undoTimer);\n    this.setState({ undoData: { label, restoreFn } });\n    this._undoTimer = setTimeout(() => this.setState(s => (s.undoData && s.undoData.label === label) ? { undoData: null } : {}), 6000);\n  }\n  undoLast() {\n    const u = this.state.undoData;\n    if (!u) return;\n    if (this._undoTimer) clearTimeout(this._undoTimer);\n    u.restoreFn();\n    this.setState({ undoData: null });\n  }\n  mustOk(res) { if (res && res.error) throw res.error; return res; }\n  // ---- write-failure surface -----------------------------------------------\n  // Every failed write lands here. Deduped by error-object identity so a write that is BOTH\n  // intercepted globally (watchWrite) and wrapped in sbTry is reported once, not twice —\n  // the sbTry pass upgrades the existing entry with its retry closure.\n  noteWriteFailure(label, err, retryFn) {\n    if (!err) return;\n    const ops = this._failedOps = this._failedOps || [];\n    this._notedErrors = this._notedErrors || new WeakSet();\n    if (err && typeof err === 'object') {\n      if (this._notedErrors.has(err)) {\n        if (retryFn) { const ex = ops.find(o => o.err === err); if (ex && !ex.fn) { ex.fn = retryFn; this onst batch = this.state.priceUpliftLog.find(b => !b.reverted);\n    if (!batch) return;\n    // Restores the exact price recorded per SKU. Dividing back by 1.2 would leave rounding\n    // drift on every product, so the log — not arithmetic — is the source of truth.\n    const priceBySku = {};\n    batch.entries.forEach(e => { priceBySku[e.sku] = e.oldPrice; });\n    const log = this.state.priceUpliftLog.map(b => b.batchId === batch.batchId ? { ...b, reverted: true, revertedAt: new Date().toISOString() } : b);\n    this.setState(s => ({ inventory: s.inventory.map(i => priceBySku[i.sku] != null ? { ...i, price: priceBySku[i.sku] } : i), priceUpliftLog: log, showUpliftModal: false }));\n    try { localStorage.setItem('sl_price_uplift', JSON.stringify(log)); } catch (e) {}\n    this.logActivity('Undid VAT price uplift', batch.entries.length + ' SKUs restored');\n    if (this.sb && this.state.session) batch.entries.forEach(e => this.sb.from('inventory').update({ price: e.oldPrice }).eq('sku', e.sku).catch(() => {}));\n    this.toastMsg('Prices restored');\n  }\n  syncCostBatches(sku, queue) {\n    if (!this.sb || !this.state.session) return;\n    this.sb.from('cost_batches').delete().eq('sku', sku).then(() => {\n      const rows = (queue || []).filter(b => b.qty > 0).map(b => ({ sku, qty: b.qty, cost_gbp: b.cost }));\n      return rows.length ? this.sb.from('cost_batches').insert(rows) : null;\n    }).catch(err => console.error('Supabase cost batch sync failed', err));\n  }\n  async syncCatalogPriceAfterReceipt(supplierName, lines, fxRate) {\n    if (!this.sb || !this.state.session) return;\n    try {\n      const { data: sup } = await this.sb.from('suppliers').select('id').ilike('name', supplierName).maybeSingle();\n      if (!sup) return;\n      const fx = parseFloat(fxRate) || null;\n      for (const l of lines) {\n        if (l.landedGbp != null) await this.sb.from('supplier_catalog').update({ price_gbp: l.landedGbp, exchange_rate: fx }).eq('supplier_id', sup.id).eq ity('Imported inventory CSV', added + ' added, ' + updated + ' updated');\n    this.removeMissingCostBacklog(inv.filter(i => i.cost > 0).map(i => i.sku));\n    if (this.sb && this.state.session) {\n      const upsertRows = inv.map(i => ({ sku: i.sku, name: i.name, stock: i.stock, reorder_level: i.reorder, cost: i.cost, price: i.price, postage_type: i.postage }));\n      this.sbTry('Import inventory', async () => { this.mustOk(await this.sb.from('inventory').upsert(upsertRows, { onConflict: 'sku' })); });\n    }\n  }\n  handlePOImportFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => this.importPOCsv(reader.result);\n    reader.readAsText(file);\n    e.target.value = '';\n  }\n  importPOCsv(raw) {\n    if (!this.requireEdit()) return;\n    const { rows } = this.parseGenericCsv(raw);\n    if (!rows.length) return;\n    // Export CSV's columns (id, supplier, orderDate, service, status, items, total) are a flattened\n    // summary with no per-line SKU/qty/price data, so re-import can only patch existing POs matched\n    // by id — it can't reconstruct new multi-line POs, and status is intentionally left alone here\n    // since 'Received' has inventory side effects that shouldn't fire from a silent bulk edit.\n    let updated = 0, skipped = 0;\n    const pos = this.state.purchaseOrders.map(p => ({ ...p }));\n    rows.forEach(r => {\n      const id = (r.id || r.ID || '').trim();\n      const idx = pos.findIndex(p => p.id === id);\n      if (!id || idx === -1 || pos[idx].status === 'Received' || pos[idx].status === 'Partially Received') { skipped++; return; }\n      const patch = {};\n      if (r.supplier) patch.supplier = r.supplier;\n      if (r.orderDate) patch.orderDate = r.orderDate;\n      if (r.service) patch.service = r.service;\n      pos[idx] = { ...pos[idx], ...patch };\n      updated++;\n    });\n    this.setState({ purchaseOrders: pos });\n    this.logActivity('Imported purchase orders CSV', updated + ' updated, ' + skipped + ' skipped (unknown id or locked)');\n    if (this.sb && this.state.session) {\n      rows.forEach(r => {\n        const id = (r.id || r.ID || '').trim();\n        const po = pos.find(p => p.id === id);\n        if (!po) return;\n        (async () => {\n          const patch = {};\n          if (r.orderDate) patch.order_date = r.orderDate;\n          if (r.service) patch.service = r.service;\n          if (r.supplier) {\n            try {\n              const { data: sup } = await this.sb.from('suppliers').select('id').ilike('name', r.supplier).maybeSingle();\n              if (sup) patch.supplier_id = sup.id;\n            } catch (err) { console.error('Supabase supplier lookup failed', err); }\n          }\n          if (Object.keys(patch).length) this.sb.from('purchase_orders').update(patch).eq('po_number', id).catch(err => console.error('Supabase PO import update failed', err));\n        })();\n      });\n    }\n  }\n  handleSupplierImportFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => this.importSuppliersCsv(reader.result);\n    reader.readAsText(file);\n    e.target.value = '';\n  }\n  importSuppliersCsv(raw) {\n    if (!this.requireEdit()) return;\n    const { rows } = this.parseGenericCsv(raw);\n    if (!rows.length) return;\n    const sups = this.state.suppliers.map(s => ({ ...s }));\n    let added = 0, updated = 0;\n    const toUpdateRemote = [], toInsertRemote = [];\n    rows.forEach((r, i) => {\n      const name = (r.name || '').trim();\n      if (!name) return;\n      const idx = sups.findIndex(s => s.name.toLowerCase() === name.toLowerCase());\n      const patch = {};\n      if (r.contact) patch.contact = r.contact.trim();\n      if (r.phone) patch.phone = r.phone.trim();\n      if (r.product) patch.product = r.product.trim();\n      if (r.platform) patch.platform = r.platform.trim();\n      if (r.leadTime) patch.leadTime = r.leadTime.trim();\n      if (r.status === 'Active' || r.status === 'Inactive') patch.status = r.status;\n      if (idx >= 0) {\n        sups[idx] = { ...sups[idx], ...patch }; updated++;\n        if (typeof sups[idx].id === 'string') toUpdateRemote.push(sups[idx]);\n      } else {\n        const rec = { id: Date.now() + i, name, contact: r.contact || '', phone: r.phone || '', product: r.product || '', platform: r.platform || 'Other', leadTime: r.leadTime || '—', skuCount: parseInt(r.skuCount) || 0, status: r.status === 'Inactive' ? 'Inactive' : 'Active' };\n        sups.push(rec); added++; toInsertRemote.push(rec);\n      }\n    });\n    this.setState({ suppliers: sups });\n    this.logActivity('Imported suppliers CSV', added + ' added, ' + updated + ' updated');\n    if (this.sb && this.state.session) this.sbTry('Import suppliers', async () => {\n      for (const sp of toUpdateRemote) this.mustOk(await this.sb.from('suppliers').update({ name: sp.name, contact_email: sp.contact, phone: sp.phone, product: sp.product, platform: sp.platform, status: sp.status }).eq('id', sp.id));\n      for (const sp of toInsertRemote) this.mustOk(await this.sb.from('suppliers').insert({ name: sp.name, contact_email: sp.contact, phone: sp.phone, product: sp.product, platform: sp.platform, status: sp.status }));\n      this.loadAllData();\n    });\n  }\n  exportCsv(rows, filename) {\n    const csv = toCsv(rows);\n    if (!csv) return;\n    const blob = new Blob([csv], { type: 'text/csv' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    a.href = url; a.download = filename; a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 2000);\n  }\n\n  handleSalesCsvFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = () => {\n      this.setState({ salesCsvFileText: reader.result, salesCsvFileName: file.name });\n    };\n    reader.readAsText(file);\n  }\n\n  parseSalesCsv(raw, fileName) {\n    const lines = raw.split('\\n');\n    let headerIdx = -1;\n    for (let i = 0; i < Math.min(10, lines.length); i++) {\n      if (lines[i] && lines[i].toLowerCase().includes('order number')) { headerIdx = i; break; }\n    }\n    if (headerIdx === -1) { this.setState({ salesCsvFileName: fileName + ' — could not find header row (expected an \"Order number\" column)' }); return; }\n    const splitLine = line => {\n      const out = []; let cur = ''; let inQ = false;\n      for (let i = 0; i < line.length; i++) {\n        const c = line[i];\n        if (c === '\"') { inQ = !inQ; continue; }\n        if (c === ',' && !inQ) { out.push(cur); cur = ''; continue; }\n        cur += c;\n      }\n      out.push(cur); return out;\n    };\n    const header = splitLine(lines[headerIdx]).map(h => h.trim());\n    const find = name => header.findIndex(h => h.toLowerCase() === name.toLowerCase());\n    const iOrder = find('Order number'), iCustom = find('Custom label'), iQty = find('Quantity'),\n      iTotal = find('Total price'), iSoldFor = find('Sold for'), iDate = find('Sale date'), iDelivery = find('Delivery service'),\n      iRecordNum = find('Sales record number'), iTxId = find('Transaction ID');\n    if (iOrder === -1 || iQty === -1) { this.setState({ salesCsvFileName: fileName + ' — missing expected columns' }); return; }\n    const orders = [];\n    const seenLineIdCount = {};\n    // Multi-item orders put one order-level \"header\" row (blank Custom label, correct order Total\n    // price) alongside per-item rows (real SKU, blank Total price). Keeping the header AND the items\n    // double-counts qty/revenue and dumps a chunk of real sales onto a fake '—' SKU. Pre-scan order\n    // numbers so a blank-SKU row can be dropped whenever real-SKU siblings exist for that order —\n    // a blank-SKU row with NO siblings is a genuine unattributed sale and is kept as-is.\n    const orderHasRealSku = {};\n    for (let i = headerIdx + 1; i < lines.length; i++) {\n      const line = lines[i]; if (!line || !line.trim()) continue;\n      const cols = splitLine(line);\n      const order = (cols[iOrder] || '').trim(); if (!order) continue;\n      if ((cols[iCustom] || '').trim()) orderHasRealSku[order] = true;\n    }\n    for (let i = headerIdx + 1; i < lines.length; i++) {\n      const line = lines[i];\n      if (!line || !line.trim()) continue;\n      const cols = splitLine(line);\n      const order = (cols[iOrder] || '').trim();\n      if (!order) continue;\n      const customRaw = (cols[iCustom] || '').trim();\n      if (!customRaw && orderHasRealSku[order]) continue; // redundant header row for this multi-item order\n      const sku = customRaw || '—';\n      const qty = parseInt(cols[iQty]) || 0;\n      // A multi-item order's real total sits on a separate header row with a blank SKU; this row\n      // (a real SKU) then has a blank Total price on eBay's own export — defaulting that to £0.00\n      // understated real sales for every SKU on a multi-item order. 'Sold for' is that line's own\n      // per-item revenue and is populated whenever Total price is blank, so it's the correct fallback.\n      const totalRaw = (cols[iTotal] || '').trim();\n      const total = totalRaw || (iSoldFor > -1 && (cols[iSoldFor] || '').trim()) || '£0.00';\n      // per-line unique id (a single order can have multiple item rows). Transaction ID is more\n      // reliably unique per line than Sales record number (eBay repeats the record number across\n      // an order's item rows on some exports) — falls back to a composite when neither is present.\n      const recordId = (iTxId > -1 && (cols[iTxId] || '').trim()) || (iRecordNum > -1 && (cols[iRecordNum] || '').trim()) || '';\n      let lineId = recordId || (order + '|' + sku + '|' + qty + '|' + total);\n      // belt-and-braces: guarantee uniqueness within this parse even if the source id still repeats\n      // (blank/duplicate transaction IDs happen on real eBay exports) — a collision here would make\n      // the whole Supabase upsert batch fail (\"ON CONFLICT command cannot affect row a second time\")\n      seenLineIdCount[lineId] = (seenLineIdCount[lineId] || 0) + 1;\n      if (seenLineIdCount[lineId] > 1) lineId += '#' + seenLineIdCount[lineId];\n      orders.push({\n        order, date: (cols[iDate] || '').trim(), channel: 'eBay',\n        sku, qty, total, status: 'Shipped',\n        delivery: (cols[iDelivery] || '').trim(),\n        lineId,\n      });\n    }\n    // Match on real lineId AND a content signature (order+sku+qty+total): a legacy row saved\n    // before line_id existed (or with a null one) would otherwise never match by id and get\n    // re-added — inflating gross sales a bit more on every repeat upload of the same file.\n    const sig = o => o.order + '|' + o.sku + '|' + o.qty + '|' + o.total;\n    const existingLineIds = new Set(this.state.salesOrders.map(o => o.lineId).filter(Boolean));\n    const existingSigs = new Set(this.state.salesOrders.map(sig));\n    const newOrders = orders.filter(o => !existingLineIds.has(o.lineId) && !existingSigs.has(sig(o)));\n    const skippedCount = orders.length - newOrders.length;\n    const label = newOrders.length + ' new order' + (newOrders.length === 1 ? '' : 's') + ' loaded from ' + fileName\n      + (skippedCount ? ' (' + skippedCount + ' already on file, skipped)' : '');\n    this.setState(s => ({ salesOrders: [...s.salesOrders, ...newOrders], salesCsvFileName: label }));\n    // upsert ALL parsed rows (not just newOrders) with real update-on-conflict: this self-heals any\n    // row a previous upload saved with a bad/missing sale_date, instead of only ever inserting new ones\n    if (orders.length) {\n      const rows = orders.map(o => ({\n        order_number: o.order, sale_date: this.toIsoDate(o.date), channel: o.channel, sku: o.sku, qty: o.qty,\n        gross_amount: parseFloat(String(o.total).replace(/[£,]/g, '')) ||  : 'Logged') + ' replacement: ' + repProductName.trim());\n    if (this.sb && this.state.session) {\n      const row = { product_name: entry.productName, sku: entry.sku || null, qty: entry.qty, unit_price: entry.price, shipping_method: entry.shipping, loss_amount: entry.loss, replaced_on: entry.date };\n      if (editingReplacementId) {\n        this.sb.from('replacements').delete().eq('id', editingReplacementId)\n          .then(() => this.sb.from('replacements').insert(row)).catch(err => console.error('Supabase replacement update failed', err));\n      } else {\n        this.sb.from('replacements').insert(row).catch(err => console.error('Supabase replacement insert failed', err));\n      }\n    }\n  }\n\n  openEditSO(order) {\n    if (!this.requireEdit()) return;\n    const s = this.state.salesOrders.find(x => x.order === order);\n    if (!s) return;\n    this.setState({\n      showEditSO: true, editSOId: s.order, soDate: s.date, soChannel: s.channel, soSku: s.sku,\n      soQty: String(s.qty), soTotal: (s.total || '').replace('£', ''), soStatus: s.status,\n    });\n  }\n  closeEditSO() { this.setState({ showEditSO: false, editSOId: null }); }\n  saveEditSO() {\n    if (!this.requireEdit()) return;\n    const { editSOId, soDate, soChannel, soSku, soQty, soTotal, soStatus } = this.state;\n    const before = this.state.salesOrders.find(o => o.order === editSOId);\n    if (!before) return;\n    const newQty = parseInt(soQty) || 0;\n    const newTotalFmt = '£' + (parseFloat(soTotal) || 0).toFixed(2);\n    const parts = [];\n    if ((before.qty || 0) !== newQty) parts.push('Qty ' + before.qty + ' → ' + newQty);\n    if (before.total !== newTotalFmt) parts.push('Total ' + before.total + ' → ' + newTotalFmt);\n    if (before.status !== soStatus) parts.push('Status ' + before.status + ' → ' + soStatus);\n    const wasRefunded = before.status === 'Refunded', nowRefunded = soStatus === 'Refunded';\n    this.setState(s => {\n      let inventory = s.inventory;\n      if (wasRefunded !== nowRefunded && soSku) {\n        const sign = nowRefunded ? 1 : -1; // becoming refunded restores stock; un-refunding re-deducts it\n        const target = s.inventory.find(i => i.sku === soSku);\n        if (target && target.components && target.components.length) {\n          inventory = s.inventory.map(i => {\n            const comp = target.components.find(c => c.sku === i.sku);\n            return comp ? { ...i, stock: (i.stock || 0) + sign * comp.qty * before.qty } : i;\n          });\n        } else if (target) {\n          inventory = s.inventory.map(i => i.sku === soSku ? { ...i, stock: (i.stock || 0) + sign * before.qty } : i);\n        }\n      }\n      return {\n        salesOrders: s.salesOrders.map(o => o.order === editSOId ? { ...o, date: soDate, channel: soChannel, sku: soSku, qty: newQty, total: newTotalFmt, status: soStatus } : o),\n        inventory, showEditSO: false, editSOId: null,\n      };\n    });\n    this.logActivity('Edited sales order ' + editSOId, parts.join(', ') + (wasRefunded !== nowRefunded ? ' · stock ' + (nowRefunded ? 'restored' : 're-deducted') : ''));\n    if (this.sb && this.state.session) {\n      this.sb.from('sales_orders').update({ channel: soChannel, sku: soSku, qty: newQty, gross_amount: parseFloat(soTotal) || 0, status: soStatus === 'Refunded' ? 'Refund' : 'Order' }).eq('order_number', editSOId)\n        .catch(err => console.error('Supabase sales order update failed', err));\n    }\n  }\n  deleteSalesOrder(order) {\n    if (!this.requireEdit()) return;\n    const entry = this.state.salesOrders.find(o => o.order === order);\n    this.setState(s => ({ salesOrders: s.salesOrders.filter(o => o.order !== order) }));\n    if (entry) this.pushUndo('Deleted order ' + order, () => this.setState(s => ({ salesOrders: [...s.salesOrders, entry] })));\n    this.logActivity('Deleted sales order ' + order);\n    if (this.sb && this.state.session) this.sb.from('sales_orders').delete().eq('order_number', order).catch(err => console.error('Supabase sales order delete failed', err));\n  }\n  setSkuPostageType(sku, displayVal) {\n    if (!this.requireEdit()) return;\n    const stored = displayVal === 'RM Tracked 48' ? 'RM48' : 'Large Letter';\n    // Most rows on this page are raw sales-order SKU strings (bundle/variant labels) with no\n    // matching live inventory row, so the override is keyed by that raw string, not an inventory row.\n    const key = String(sku || '').toLowerCase();\n    this.setState(s => ({ postageTypeOverrides: { ...s.postageTypeOverrides, [key]: stored } }));\n    this.logActivity('Set postage type for ' + sku, displayVal);\n    if (this.sb && this.state.session) this.sb.from('postage_type_overrides').upsert({ sku: key, postage_type: stored }).catch(err => console.error('Supabase postage override save failed', err));\n    const idx = this.state.inventory.findIndex(i => i.sku.toLowerCase() === key);\n    if (idx >= 0) { // also sync a matching live inventory row so Add/Edit Product reflects it\n      const realSku = this.state.inventory[idx].sku;\n      this.setState(s => ({ inventory: s.inventory.map(i => i.sku.toLowerCase() === key ? { ...i, postage: stored } : i) }));\n      if (this.sb && this.state.session) this.sb.from('inventory').update({ postage_type: stored }).eq('sku', realSku).catch(err => console.error('Supabase postage type update failed', err));\n    }\n  }\n  toggleSelectSO(order) { this.setState(s => ({ selectedOrders: s.selectedOrders.includes(order) ? s.selectedOrders.filter(x => x !== order) : [...s.selectedOrders, order] })); }\n  // Same physical sale imported twice under a different line_id (e.g. an earlier upload of an\n  // overlapping report used a different id column) shows up as two rows with identical\n  // order+sku+qty+total. Flag every row after the first with that exact signature as a duplicate.\n  findDuplicateSalesOrders() {\n    // Keep the better-quality copy, not just the first one seen: a row with a sale date beats a\n    // dateless one (an older import wrote sales_orders with sale_date NULL, and dropping the dated\n    // twin would strip the sale out of every month view).\n    const rank = o => (o.date ? 2 : 0) + (o.lineId ? 1 : 0);\n    const best = {};\n    this.state.salesOrders.forEach(o => {\n      const sig = o.order + '|' + o.sku + '|' + o.qty + '|' + o.total;\n      if (!best[sig] || rank(o) > rank(best[sig])) best[sig] = o;\n    });\n    const kept = new Set(Object.values(best));\n    return this.state.salesOrders.filter(o => !kept.has(o));\n  }\n  cleanupDuplicateSalesOrders() {\n    if (!this.requireEdit()) return;\n    const dups = this.findDuplicateSalesOrders();\n    if (!dups.length) return;\n    const dupSet = new Set(dups);\n    this.setState(s => ({ salesOrders: s.salesOrders.filter(o => !dupSet.has(o)) }));\n    this.pushUndo(dups.length + ' duplicate order line' + (dups.length === 1 ? '' : 's') + ' removed', () => this.setState(s => ({ salesOrders: [...s.salesOrders, ...dups] })));\n    this.logActivity('Cleaned up ' + dups.length + ' duplicate sales order line' + (dups.length === 1 ? '' : 's'));\n    if (this.sb && this.state.session) {\n      const ids = dups.map(d => d.lineId).filter(Boolean);\n      const chunk = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };\n      chunk(ids, 200).forEach(c => this.sb.from('sales_orders').delete().in('line_id', c).catch(err => console.error('Supabase duplicate cleanup failed', err)));\n    }\n  }\n  // Rows saved by an older upload before order-header rows were excluded from parsing: a blank/'—'\n  // SKU row that shares an order number with real-SKU rows is that multi-item order's redundant\n  // summary line — its qty/total is already (better) represented by its real-SKU siblings, so\n  // keeping it double-counts both and misattributes real revenue to a fake '—' product.\n  findPhantomHeaderRows() {\n    const orderHasRealSku = {};\n    this.state.salesOrde  };\n      })\n      .filter(r => r.sku);\n    const seen = {};\n    out.forEach(r => { if (seen[r.sku]) { let n = 2; while (seen[r.sku + '-' + n]) n++; r.sku = r.sku + '-' + n; } seen[r.sku] = true; });\n    return out;\n  }\n  // Every variant is a stock-keeping item in its own right, so a new variant gets an Inventory row\n  // straight away: zero stock, zero cost. The first PO that receives it writes the real landed cost\n  // (computeInventoryAfterReceiving treats a zero-cost item as an empty FIFO queue).\n  ensureInventoryForVariants(rows, supplierId) {\n    const fresh = (rows || []).filter(c => c.sku && !this.state.inventory.some(i => i.sku === c.sku));\n    if (!fresh.length) return;\n    const supIdOk = typeof supplierId === 'string' && supplierId.length > 20;\n    const items = fresh.map(c => ({\n      sku: c.sku,\n      name: ((c.product ? c.product + ' ' : '') + (c.name && c.name !== c.product ? c.name : '')).trim() || c.sku,\n      stock: 0, reorder: 5, cost: 0, price: 0, postage: 'Large Letter', llMaxQty: 1,\n      priceIncVat: true, components: [], costQueue: [], supplierId: supIdOk ? supplierId : null,\n    }));\n    this.setState(s => ({ inventory: [...s.inventory, ...items.filter(it => !s.inventory.some(i => i.sku === it.sku))] }));\n    if (this.sb && this.state.session) {\n      this.sb.from('inventory').upsert(items.map(it => ({ sku: it.sku, name: it.name, stock: 0, reorder_level: 5, cost: 0, price: 0, postage_type: 'Large Letter', supplier_id: it.supplierId })), { onConflict: 'sku' })\n        .catch(err => console.error('Supabase variant inventory upsert failed', err));\n    }\n  }\n  openAddSupplier() {\n    if (!this.requireEdit()) return;\n    this.setState({ showSupplierModal: true, supplierTab: 'details', editingSupplierId: null, supName: '', supEmail: '', supPhone: '', supProduct: '', supPlatform: 'Alibaba', supProdDays: '', supTransitDays: '', supCatalog: [] });\n  }\n  openEditSupplier(sp, tab) {\n    if (!this.requireEdit()) return;\ behind it were seen during an earlier, less complete import.\n  // Deliberately does NOT touch stock, FIFO batches, COGS or sales_orders.\n  buildRebuildPreview() {\n    const raw = this.state.txFileText;\n    if (!raw) return null;\n    const lines = raw.split('\\n');\n    let headerIdx = -1;\n    for (let i = 0; i < Math.min(20, lines.length); i++) if (lines[i] && lines[i].toLowerCase().includes('transaction creation date')) { headerIdx = i; break; }\n    if (headerIdx === -1) return { error: 'No header row found in the loaded Transaction Report.' };\n    const splitLine = line => {\n      const out = []; let cur = ''; let inQ = false;\n      for (let i = 0; i < line.length; i++) {\n        const c = line[i];\n        if (c === '\"') { inQ = !inQ; continue; }\n        if (c === ',' && !inQ) { out.push(cur); cur = ''; continue; }\n        cur += c;\n      }\n      out.push(cur); return out;\n    };\n    const header = splitLine(lines[headerIdx]).map(h => h.trim());\n    const find = n => header.findIndex(h => h.toLowerCase() === n.toLowerCase());\n    const iType = find('Type'), iCustom = find('Custom label'), iQty = find('Quantity'), iTxDate = find('Transaction creation date');\n    const iOrderNo = header.findIndex(h => /order number/i.test(h));\n    const iNet = header.findIndex(h => /^net amount/i.test(h));\n    const iGross = header.findIndex(h => /^gross transaction amount/i.test(h));\n    const iSubtotal = header.findIndex(h => /^item subtotal/i.test(h));\n    const iPP = header.findIndex(h => /^postage and packaging/i.test(h));\n    const iSellerTax = header.findIndex(h => /^seller collected tax/i.test(h));\n    const iDesc = header.findIndex(h => /^description$/i.test(h));\n    const feeCols = header.map((h, ix) => (/fee/i.test(h) ? ix : -1)).filter(ix => ix >= 0);\n    const pa = v => { const n = parseFloat(String(v || '').replace(/[£$,\\s]/g, '')); return isNaN(n) ? 0 : n; };\n    const uploadMK = new Date().getFullYear() + '-' + String(new Date().getMon
