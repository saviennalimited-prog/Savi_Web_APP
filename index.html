for SKUs sold before FIFO tracking)' : 'uses current flat cost per SKU (upload a Transaction Report to switch to actual FIFO)') + '; ' + (skuProfitUsesFees ? 'fees are actual per-order fees from your report (promoted-listing/other fees spread by revenue share)' : feesIsActual ? 'fees are actual monthly total, allocated by revenue share' : 'fees estimated at ' + this.state.feeRatePct + '%, allocated by revenue share') + '; postage ' + (postageIsActual ? 'is actual label spend' : 'is estimated') + ', allocated by units.';\n    const rcvRowsVals = this.state.rcvRows.map(r => ({ ...r, setNow: e => this.setRcvQty(r.sku, e.target.value) }));\n\n    const nowMs = Date.now();\n    const lastSaleBySku = {};\n    this.state.salesOrders.forEach(s => {\n      if (s.status === 'Refunded') return;\n      const d = this.parseOrderDate(s.date);\n      if (!d) return;\n      const soldSkuItem = this.state.inventory.find(i => i.sku.toLowerCase() === String(s.sku || '').toLowerCase());\n      const creditSale = (sku) => { const t = d.getTime(); if (!lastSaleBySku[sku] || t > lastSaleBySku[sku]) lastSaleBySku[sku] = t; };\n      if (soldSkuItem) {\n        creditSale(soldSkuItem.sku);\n        (soldSkuItem.components || []).forEach(c => creditSale(c.sku)); // bundle sales keep components alive\n      } else if (s.sku) creditSale(s.sku);\n    });\n    const deadRows = this.state.inventory\n      .filter(i => !(i.components && i.components.length) && (i.stock || 0) > 0)\n      .map(i => {\n        const last = lastSaleBySku[i.sku];\n        const daysSince = last ? Math.floor((nowMs - last) / 86400000) : null;\n        const tied = (i.stock || 0) * (i.cost || 0);\n        return { ...i, daysSince, tied };\n      })\n      .filter(r => r.daysSince == null || r.daysSince >= 30)\n      .sort((a, b) => (b.daysSince == null ? 9999 : b.daysSince) - (a.daysSince == null ? 9999 : a.daysSince) || b.tied - a.tied);\n    const bandOf = ds => ds == null ? { label: 'Never sold', color: 'var(--red)', bg: 'var(--red-soft)' } : ds >= 90 ? { label: '90d+', color: 'var(--red)', bg: 'var(--red-soft)' } : ds >= 60 ? { label: '60–89d', color: 'var(--amb-deep)', bg: 'var(--amb-soft)' } : { label: '30–59d', color: 'var(--mut)', bg: 'var(--soft)' };\n    const deadTiedTotal = deadRows.reduce((s2, r) => s2 + r.tied, 0);\n    const deadStockRows = deadRows.map(r => {\n      const b = bandOf(r.daysSince);\n      return {\n        sku: r.sku, name: r.name, stock: r.stock,\n        lastSaleFmt: r.daysSince == null ? 'no sales recorded' : r.daysSince + ' days ago',\n        bandLabel: b.label, bandColor: b.color, bandBg: b.bg,\n        tiedFmt: '£' + r.tied.toFixed(2),\n        pctOfTied: deadTiedTotal > 0 ? ((r.tied / deadTiedTotal) * 100).toFixed(0) + '%' : '0%',\n        barPct: deadTiedTotal > 0 ? Math.max(1.5, (r.tied / deadTiedTotal) * 100).toFixed(1) + '%' : '0%',\n      };\n    });\n    const hasDeadStock = deadStockRows.length > 0;\n    const deadStockKpis = [\n      { label: 'Slow / dead SKUs (30d+ no sales)', value: String(deadRows.length) },\n      { label: 'Cash tied up (at cost)', value: '£' + deadTiedTotal.toFixed(2) },\n      { label: 'Worst offender', value: deadRows.length ? deadRows[0].sku : '—' },\n      { label: '90d+ / never sold', value: String(deadRows.filter(r => r.daysSince == null || r.daysSince >= 90).length) },\n    ];\n    const postageBannerLabel = 'Total postage — ' + reportMonthLabel + ' (eBay labels + Royal Mail)';\n    const postageBannerValue = '£' + postageForProfit.toFixed(2);\n    // Orders shipped and spend per service, side by side with what eBay charged directly.\n    const shippedRows = [\n      { label: 'RM Large Letter', orders: String(llCount), rate: '£' + llRate.toFixed(2), value: '£' + llCost.toFixed(2), color: 'var(--acc-deep)' },\n      { label: 'RM Tracked 48', orders: String(t48Count), rate: '£' + t48Rate.toFixed(2), value: '£' + t48Cost.toFixed(2), color: 'var(--teal-deep)' },\n      { label: 'eBay-bought labels', orders: '—', rate: 'from report', value: '£' + ebayLabelSpend.toFixed(2), color: 'var(--mut)' },\n    ];\n    const shippedTotalOrders = String(llCount + t48Count);\n    const shippedTotalValue = '£' + postageForProfit.toFixed(2);\n\n    // Cash flow: committed (open POs) vs paid (received) vs incoming revenue\n    const cfCommitted = purchaseOrdersAll.filter(p => p.status !== 'Received').reduce((s, p) => s + p.lines.reduce((ls, l) => ls + l.qty * this.lineGbp(l), 0), 0);\n    const cfPaid = purchaseOrdersAll.filter(p => p.status === 'Received').reduce((s, p) => s + p.lines.reduce((ls, l) => ls + l.qty * this.lineGbp(l), 0), 0);\n    const cfOutflow = cfPaid + postageCostTotal + otherExpensesTotal;\n    const cfNetPosition = grossSales - cfOutflow - cfCommitted;\n    const cashflowKpis = [\n      { label: 'Incoming revenue (MTD) — actual', value: '£' + grossSales.toFixed(2), color: 'var(--acc)' },\n      { label: 'Committed (open POs) — planned', value: '£' + cfCommitted.toFixed(2), color: 'var(--amb)' },\n      { label: 'Paid out (received POs + costs) — actual', value: '£' + cfOutflow.toFixed(2), color: 'var(--red)' },\n      { label: 'Net cash position', value: '£' + cfNetPosition.toFixed(2), color: cfNetPosition >= 0 ? 'var(--grn)' : 'var(--red)' },\n    ];\n    const cashflowPOs = purchaseOrdersAll.filter(p => p.status !== 'Received').map(p => ({\n      id: p.id, supplier: p.supplier, orderDate: p.orderDate, status: p.status, totalFmt: p.totalFmt, statusBg: p.statusBg, statusColor: p.statusColor,\n    }));\n\n    // PO commitments trend: reuses the Overview trend's month scaffolding (trendMonths) to show\n    // committed (still-open) vs. received PO value by the month each PO was placed.\n    const cfTrendAgg = {};\n    purchaseOrdersAll.forEach(p => {\n      const k = this.orderMonthKey(p.orderDate);\n      if (!k) return;\n      if (!cfTrendAgg[k]) cfTrendAgg[k] = { committed: 0, paid: 0 };\n      const val = p.lines.reduce((ls, l) => ls + l.qty * this.lineGbp(l), 0);\n      if (p.status === 'Received') cfTrendAgg[k].paid += val; else cfTrendAgg[k].committed += val;\n    });\n    const cfTrendPts = trendMonths.map(m => {\n      const a = cfTrendAgg[m.key] || { committed: 0, paid: 0 };\n      return { label: m.label, committed: a.committed, paid: a.paid };\n    });\n    const cfTrendMax = Math.max(1, ...cfTrendPts.map(p => p.committed + p.paid));\n    const cfTrendBars = cfTrendPts.map(p => ({\n      label: p.label,\n      committedPct: ((p.committed / cfTrendMax) * 100).toFixed(1) + '%',\n      paidPct: ((p.paid / cfTrendMax) * 100).toFixed(1) + '%',\n      totalFmt: '£' + (p.committed + p.paid).toFixed(0),\n    }));\n    const hasCfTrend = cfTrendPts.some(p => p.committed + p.paid > 0);\n\n    // Channel breakdown (Reports)\n    const channelAgg = {};\n    salesOrdersMonth.forEach(s => {\n      const ch = s.channel || 'Other';\n      if (!channelAgg[ch]) channelAgg[ch] = { revenue: 0, orders: 0 };\n      channelAgg[ch].revenue += parseFloat(String(s.total).replace(/[£,]/g, '')) || 0;\n      channelAgg[ch].orders += 1;\n    });\n    const channelBreakdown = Object.entries(channelAgg).map(([name, a]) => ({\n      name, revenueFmt: '£' + a.revenue.toFixed(2), orders: a.orders,\n      pct: (reportGrossSales > 0 ? (a.revenue / reportGrossSales) * 100 : 0).toFixed(1) + '%',\n    })).sort((a, b) => parseFloat(b.revenueFmt.slice(1)) - parseFloat(a.revenueFmt.slice(1)));\n\n    const profitWaterfall = [\n      { label: 'Gross sales', value: '£' + grossSales.toFixed(2), bold: '400' },\n      { label: feesIsActual ? 'eBay fees — actual (from report)' : 'eBay fees — estimated (' + this.state.feeRatePct + '%)', value: '-£' + ebayFees.toFixed(2), bold: '400' },\n      { label: 'Net revenue (after fees)', value: '£' + netRevenue.toFixed(2), bold: '800' },\n      { label: 'Cost of goods (COGS)' + (cogsIsActual ? ' — actual (FIFO)' : ' — estimated (flat cost)'), value: '-£' + cogs.toFixed(2), bold: '400' },\n      { label: 'Postage — eBay labels + Royal Mail (LL + T48)', value: '-£' + postageForProfit.toFixed(2), bold: '400' },\n      ...(vatExclView ? [\n        { label: 'Output VAT on sales (÷ 6 — not yours to keep)', value: '-£' + outputVat.toFixed(2), bold: '400' },\n        { label: 'VAT reclaimed on fees & Tracked 48', value: '+£' + (feeVatReclaim + t48VatReclaim).toFixed(2), bold: '400' },\n      ] : []),\n      { label: 'eBay net profit', value: '£' + ebayNetProfit.toFixed(2), bold: '800' },\n      { label: 'Other expenses', value: '-£' + otherExpensesTotal.toFixed(2), bold: '400' },\n      ...(vatExclView && expVatReclaim > 0 ? [{ label: 'VAT reclaimed on expenses', value: '+£' + expVatReclaim.toFixed(2), bold: '400' }] : []),\n      { label: 'Total net profit', value: '£' + totalNetProfit.toFixed(2), bold: '800' },\n    ];\n\n    const skuAgg = {};\n    this.state.salesOrders.forEach(s => {\n      const sku = s.sku || '—';\n      if (!skuAgg[sku]) skuAgg[sku] = { sku, orders: 0, units: 0, revenue: 0 };\n      skuAgg[sku].orders += 1;\n      skuAgg[sku].units += (s.qty || 0);\n      skuAgg[sku].revenue += parseFloat(String(s.total).replace(/[£,]/g, '')) || 0;\n    });\n    const skuList = Object.values(skuAgg).map(a => {\n      const inv = inventoryFull.find(i => i.sku === a.sku);\n      return { ...a, title: inv ? inv.name : a.sku, gross: '£' + a.revenue.toFixed(2) };\n    });\n    // Every SKU that has ever sold, richest first, with the cost of goods behind it. Cost comes from\n    // live Inventory, then Old Inventory — a SKU in neither shows a dash, not a misleading £0.00.\n    const allSkuRows = skuList\n      .slice()\n      .sort((a, b) => b.revenue - a.revenue)\n      .map(a => {\n        const inv = this.state.inventory.find(i => i.sku.toLowerCase() === String(a.sku).toLowerCase());\n        const old = (this.state.oldInventory || []).find(o => o.sku.toLowerCase() === String(a.sku).toLowerCase());\n        const unitCost = inv && inv.cost > 0 ? inv.cost : (old && old.cost > 0 ? old.cost : null);\n        const cogs = unitCost != null ? unitCost * a.units : null;\n        return {\n          sku: a.sku, title: a.title, orders: String(a.orders), units: String(a.units),\n          revenue: '£' + a.revenue.toFixed(2),\n          unitCostFmt: unitCost != null ? '£' + unitCost.toFixed(2) : '—',\n          cogsFmt: cogs != null ? '£' + cogs.toFixed(2) : 'no cost set',\n          cogsColor: cogs != null ? 'var(--ink)' : 'var(--amb-deep)',\n        };\n      });\n    const allSkuTotals = {\n      count: String(allSkuRows.length),\n      units: String(skuList.reduce((s, a) => s + a.units, 0)),\n      revenue: '£' + skuList.reduce((s, a) => s + a.revenue, 0).toFixed(2),\n      missing: String(allSkuRows.filter(r => r.cogsFmt === 'no cost set').length),\n    };\n    const fastMovers = skuList.filter(a => a.units >= 20).sort((a, b) => b.units - a.units).slice(0, 10);\n    const slowMovers = skuList.filter(a => a.units <= 2).sort((a, b) => a.units - b.units).slice(0, 10);\n    const steadyCount = skuList.filter(a => a.units > 2 && a.units < 20).length;\n    const totalSkuUnits = skuList.reduce((sum, a) => sum + a.units, 0);\n    const avgUnitsPerSku = skuList.length ? (totalSkuUnits / skuList.length).toFixed(1) : '0';\n    const skuHealthKpis = [\n      { label: 'Fast movers (20+ units)', value: String(fastMovers.length), color: 'var(--grn)' },\n      { label: 'Steady movers', value: String(steadyCount), color: 'var(--ink)' },\n      { label: 'Slow movers (≤2 units)', value: String(slowMovers.length), color: 'var(--red)' },\n      { label: 'Avg units / SKU', value: avgUnitsPerSku, color: 'var(--ink)' },\n    ];\n\n    const repQ = this.state.repProductName.trim().toLowerCase();\n    const repMatches = (!this.state.repSku && repQ) ? inventoryFull.filter(i => i.name.toLowerCase().includes(repQ) || i.sku.toLowerCase().includes(repQ)).slice(0, 5) : [];\n    const repQtyNum = parseInt(this.state.repQty) || 0;\n    const repPriceNum = parseFloat(this.state.repPrice) || 0;\n    const repPostageRate = this.state.repShipping === 'RM48' ? (parseFloat(this.state.t48Rate) || 0) : (parseFloat(this.state.llRate) || 0);\n    const repEstimatedLoss = repPostageRate + repPriceNum * repQtyNum;\n    const replacements = this.state.replacements.map(r => ({\n      ...r, lossFmt: '£' + r.loss.toFixed(2), shippingLabel: r.shipping === 'RM48' ? 'RM Tracked 48' : 'RM Large Letter',\n      editClick: () => this.openEditReplacement(r), deleteClick: () => this.deleteReplacement(r.id),\n    }));\n    const replacementTotal = this.state.replacements.reduce((sum, r) => sum + r.loss, 0);\n\n    const ccRows = this.state.ccRows.map(r => ({ ...r, setCounted: e => this.setCcCounted(r.sku, e.target.value), setReason: e => this.setCcReason(r.sku, e.target.value) }));\n    const recentCounts = this.state.stockCounts.slice(0, 20);\n    const accuracyPctRaw = recentCounts.length ? (100 - (recentCounts.reduce((sum, c) => sum + Math.abs(c.variance) / Math.max(1, c.systemQty), 0) / recentCounts.length) * 100) : null;\n    const accuracyPct = accuracyPctRaw == null ? null : Math.max(0, Math.min(100, accuracyPctRaw));\n    const recentStockCounts = recentCounts.slice(0, 8).map(c => ({\n      ...c, varianceFmt: (c.variance > 0 ? '+' : '') + c.variance,\n      varianceColor: c.variance === 0 ? 'var(--mut)' : c.variance > 0 ? 'var(--grn)' : 'var(--red)',\n    }));\n\n    const scenarioQ = (this.state.scenarioQuery || '').trim().toLowerCase();\n    const scenarioMatches = (!this.state.scenarioSku && scenarioQ) ? inventoryFull.filter(i => !i.components && (i.name.toLowerCase().includes(scenarioQ) || i.sku.toLowerCase().includes(scenarioQ))).slice(0, 5) : [];\n    const scenarioItem = inventoryFull.find(i => i.sku === this.state.scenarioSku);\n    let scenarioResult = null;\n    if (scenarioItem) {\n      const perDay = velocityBySku[scenarioItem.sku] || 0;\n      const leadDays = parseInt(this.state.scenarioLeadDays) || leadDaysFor(scenarioItem.supplierId);\n      const st
